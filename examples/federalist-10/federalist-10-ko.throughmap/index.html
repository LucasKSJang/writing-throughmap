<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>throughmap</title>
<style>
:root {
  --bg: #ffffff;
  --text: #1f1f1e;
  --text-2: #5f5e5a;
  --line: #e6e4dd;
  --border: #d3d1c7;
  --surface-1: #f7f6f2;
  --surface-2: #ffffff;
  --hover: #efede6;
  --sel: rgba(127, 119, 221, 0.16);
  --sel-edge: rgba(127, 119, 221, 0.7);
  --teal: #1D9E75;
  --purple: #7F77DD;
  --radius: 6px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo",
    "Noto Sans KR", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a19;
    --text: #ecebe6;
    --text-2: #a9a79f;
    --line: #302f2c;
    --border: #4a4943;
    --surface-1: #232321;
    --surface-2: #2b2b28;
    --hover: #353431;
    --sel: rgba(127, 119, 221, 0.3);
    --sel-edge: rgba(150, 143, 232, 0.9);
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.55 var(--font);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
:lang(ko) { word-break: keep-all; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; }
strong { font-weight: 600; }
:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
.tm-page { max-width: calc(1080px + 32px); margin: 0 auto; padding: 28px 16px 40px; }

/* Errors from the page's own script, shown above everything. */
#tm-errors {
  margin: 0;
  padding: 10px 16px;
  font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
  white-space: pre-wrap;
  color: var(--text);
  background: var(--surface-1);
  border-bottom: 2px solid var(--text);
}

/* Header */
.tm-head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px 24px;
}
.tm-head-text { flex: 1 1 320px; min-width: 0; }
.tm-title {
  margin: 0;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.tm-meta { margin-top: 4px; font-size: 12.5px; color: var(--text-2); }
.tm-actions { text-align: right; }
.tm-buttons { display: flex; gap: 6px; justify-content: flex-end; }
.tm-button {
  padding: 5px 12px;
  font-size: 12.5px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
  cursor: pointer;
}
.tm-button:hover:not(:disabled) { background: var(--hover); }
.tm-button:disabled { opacity: 0.5; cursor: default; }
.tm-note { margin-top: 4px; font-size: 12px; color: var(--text-2); }
.tm-thesis { margin: 16px 0 12px; padding: 8px 14px; border-left: 2px solid var(--border); }
.tm-thesis-text { font-size: 15px; }
.tm-label { font-size: 12px; color: var(--text-2); }
.tm-questions { list-style: none; margin: 2px 0 0; padding: 0; display: grid; gap: 3px; }
.tm-q-id { font-weight: 600; margin-right: 6px; }
.tm-q-note { margin-left: 6px; font-size: 12.5px; color: var(--text-2); }
.tm-dot {
  display: inline-block;
  flex: none;
  width: 8px;
  height: 8px;
  margin-right: 6px;
  border-radius: 50%;
  vertical-align: 1px;
}

/* Panels */
.tm-panel { margin-top: 14px; padding: 16px 0 10px; border-top: 1px solid var(--line); }
.tm-panel-title { margin: 0 0 2px; font-size: 16px; line-height: 1.4; font-weight: 600; }
.tm-hint { margin: 0 0 10px; font-size: 12.5px; color: var(--text-2); }

/* Section flow */
.tm-flow-pair.is-compare { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px 20px; }
.tm-col-head, .tm-map-head {
  margin: 0 0 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
}
.tm-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: start;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-1);
}
.tm-sec-head { font-size: 12.5px; color: var(--text-2); }
.tm-short { font-weight: 600; color: var(--text); }
.tm-inferred {
  display: inline-block;
  margin-left: 6px;
  padding: 0 6px;
  font-size: 11.5px;
  line-height: 1.5;
  border: 1px dashed var(--border);
  border-radius: 4px;
}
.tm-concl { margin-top: 2px; }
.tm-seq { margin-top: 6px; line-height: 2.15; }
.tm-step { white-space: nowrap; }
.tm-arrow { font-size: 12px; color: var(--text-2); }
.tm-role, .tm-role-before {
  padding: 1px 7px;
  font-size: 12px;
  line-height: 1.5;
  white-space: nowrap;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--surface-2);
}
.tm-role { cursor: pointer; }
.tm-role-before { display: inline-block; color: var(--text-2); background: transparent; }
.tm-card.is-before { background: transparent; }
.tm-role:hover { border-color: var(--text-2); }
.tm-role[aria-pressed="true"] { background: var(--sel); border-color: var(--sel-edge); }
.tm-warn {
  display: inline-block;
  min-width: 16px;
  height: 16px;
  margin-left: 3px;
  padding: 0 4px;
  font-size: 11px;
  line-height: 16px;
  font-weight: 600;
  text-align: center;
  vertical-align: 1px;
  color: var(--bg);
  background: var(--text);
  border-radius: 8px;
  cursor: help;
}
.tm-answers { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.tm-chip {
  display: inline-flex;
  align-items: center;
  padding: 1px 8px;
  font-size: 12px;
  line-height: 1.5;
  white-space: nowrap;
  border: 1px solid var(--border);
  border-radius: 5px;
}
.tm-baton { padding: 4px 0 4px 18px; font-size: 12.5px; color: var(--text-2); }

/* Thread map */
.tm-map-scroll { overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; }
.tm-svg { display: block; overflow: visible; }
.tm-measure { position: absolute; left: -10000px; top: 0; visibility: hidden; }
.tm-svg text { font-family: var(--font); font-size: 11px; fill: var(--text-2); }
.tm-svg .tm-bandbg { fill: var(--surface-1); }
.tm-svg .tm-bandbg.is-odd { fill: transparent; }
.tm-svg .tm-sep { stroke: var(--line); stroke-width: 1; }
.tm-svg .tm-col { fill: transparent; cursor: pointer; }
.tm-svg .tm-col.is-sel { fill: var(--sel); }
.tm-svg .tm-num { cursor: pointer; transition: opacity 0.15s; }
.tm-svg .tm-num.is-sel { fill: var(--text); font-weight: 600; }
.tm-svg .tm-num.is-faint { opacity: 0.3; }
.tm-svg .tm-lname { cursor: pointer; }
.tm-svg .tm-lname:focus { outline: none; }
.tm-svg .tm-lname-bg { fill: transparent; }
.tm-svg .tm-lname:hover .tm-lname-bg { fill: var(--hover); }
.tm-svg .tm-lname[aria-pressed="true"] .tm-lname-bg { fill: var(--sel); }
.tm-svg .tm-lname:focus-visible .tm-lname-bg { stroke: var(--purple); stroke-width: 1.5; }
.tm-svg .tm-lname-name, .tm-svg .tm-lname-desc { font-size: 12px; }
.tm-svg .tm-lname-name { fill: var(--text); font-weight: 600; }
.tm-svg .tm-lane { transition: opacity 0.15s; }
.tm-svg .tm-lane.is-dim { opacity: 0.12; }
.tm-svg .tm-lane line { pointer-events: none; }
.tm-svg .tm-span { stroke-width: 1; stroke-dasharray: 2 4; }
.tm-svg .tm-run { stroke-width: 2.5; stroke-opacity: 0.5; stroke-linecap: round; }
.tm-svg .tm-mark { cursor: pointer; }
#tm-compare-legend { margin-top: -6px; }
.tm-map-head:not(:first-child) { margin-top: 8px; }
#tm-map-before .tm-lname { cursor: default; }
#tm-map-before .tm-lname:hover .tm-lname-bg { fill: transparent; }
.tm-svg .tm-link line:not(.tm-hit) { stroke: var(--text-2); stroke-width: 1; }
.tm-svg .tm-link.is-sel line:not(.tm-hit) { stroke: var(--sel-edge); }
.tm-svg .tm-link line.tm-hit { stroke: transparent; stroke-width: 10; }
.tm-svg .tm-badge { font-weight: 600; fill: var(--text); }

/* Detail box */
.tm-detail {
  min-height: 78px;
  margin-top: 8px;
  padding: 9px 12px;
  font-size: 13px;
  border: 1px solid var(--line);
  border-radius: 8px;
}
.tm-detail.is-empty { color: var(--text-2); }
.tm-detail-threads { margin-top: 2px; font-size: 12.5px; color: var(--text-2); }
.tm-detail-note { margin-top: 2px; color: var(--text-2); }
.tm-detail-before { margin-top: 3px; font-size: 12.5px; color: var(--text-2); }
.tm-thread { white-space: nowrap; }
.tm-quote { font-style: italic; }
.tm-quote:lang(ko), .tm-quote:lang(ja), .tm-quote:lang(zh) { font-style: normal; }
.tm-warn-note { margin-top: 4px; font-size: 12.5px; }
.tm-bad-note { margin-left: 6px; font-style: normal; color: var(--text); white-space: nowrap; }
.tm-warn-note::before, .tm-bad-note::before {
  content: "!";
  display: inline-block;
  width: 16px;
  height: 16px;
  margin-right: 6px;
  font-size: 11px;
  line-height: 16px;
  font-weight: 600;
  text-align: center;
  font-style: normal;
  color: var(--bg);
  background: var(--text);
  border-radius: 8px;
}
.is-bad .tm-quote, .tm-quote.is-bad {
  text-decoration: underline wavy var(--text-2);
  text-underline-offset: 3px;
}

/* Paragraph list */
.tm-list { margin-top: 12px; }
.tm-list > summary { cursor: pointer; font-size: 13px; color: var(--text-2); }
.tm-rows { margin-top: 6px; }
.tm-row {
  display: grid;
  grid-template-columns: 40px 108px minmax(0, 1fr);
  gap: 2px 8px;
  align-items: baseline;
  padding: 6px 0;
  font-size: 13px;
  border-bottom: 1px solid var(--line);
}
.tm-row-id { color: var(--text-2); }
.tm-row-role { justify-self: start; }
.tm-row-quote, .tm-row-mark { grid-column: 2 / 4; font-size: 12.5px; color: var(--text-2); }
.tm-row-mark { display: flex; align-items: baseline; gap: 0 4px; font-size: 12px; }
.tm-row-mark .tm-dot { align-self: center; margin-right: 2px; }

/* Recurring examples */
.tm-cases-list { display: flex; flex-wrap: wrap; gap: 6px; }
.tm-case {
  padding: 3px 10px;
  font-size: 12.5px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
  cursor: pointer;
}
.tm-case:hover { border-color: var(--text-2); }
.tm-case[aria-pressed="true"] { background: var(--sel); border-color: var(--sel-edge); }
.tm-case-name { font-weight: 600; }

/* Gaps */
#tm-gaps > summary { cursor: pointer; font-size: 16px; line-height: 1.4; font-weight: 600; }
.tm-gap, .tm-obs { padding: 9px 0; border-bottom: 1px solid var(--line); }
.tm-direction { margin-top: 2px; font-size: 12.5px; color: var(--text-2); }
.tm-subhead { margin: 16px 0 0; font-size: 13px; font-weight: 600; color: var(--text-2); }
.tm-none { margin: 8px 0 0; color: var(--text-2); }

/* What changed */
.tm-change { padding: 5px 0; border-bottom: 1px solid var(--line); }
#tm-changes-body > .tm-subhead:first-child { margin-top: 6px; }
#tm-versions { margin: 14px 0 0; }

/* Footer */
.tm-footer {
  margin-top: 18px;
  padding-top: 10px;
  font-size: 12px;
  color: var(--text-2);
  border-top: 1px solid var(--line);
}

/* #poster: the poster alone, on white whatever the colour scheme. */
html.tm-poster-mode, html.tm-poster-mode body { background: #ffffff; color-scheme: light; }
#tm-poster { display: block; margin: 0 auto; }

@media (min-width: 900px) {
  .tm-flow-pair.is-compare { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .tm-page { padding-top: 20px; }
  .tm-card { grid-template-columns: minmax(0, 1fr); }
  .tm-answers { justify-content: flex-start; }
  .tm-actions { text-align: left; }
  .tm-row { grid-template-columns: 36px minmax(0, 1fr); }
  .tm-row-label { grid-column: 2; }
  .tm-row-quote, .tm-row-mark { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
@page { margin: 14mm; }
@media print {
  :root {
    --bg: #ffffff;
    --text: #1f1f1e;
    --text-2: #5f5e5a;
    --line: #e6e4dd;
    --border: #d3d1c7;
    --surface-1: #f7f6f2;
    --surface-2: #ffffff;
    --sel: rgba(127, 119, 221, 0.16);
    color-scheme: light;
  }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { background: #ffffff; }
  .tm-page { max-width: none; padding: 0; }
  /* What only works on screen: the buttons, the detail box and the hints about clicking. */
  .tm-actions, #tm-detail, #tm-errors:empty, #tm-cases-hint, .tm-toggle-hint {
    display: none !important;
  }
  .tm-map-scroll { overflow: visible; }
  /* The maps of a comparison shrink together: --share is a map's part of the strip's width. */
  #tm-map, #tm-map-before, #tm-links { max-width: calc(100% * var(--share, 1)); height: auto; }
  .tm-card, .tm-baton, .tm-map-scroll, .tm-row, .tm-gap, .tm-obs, .tm-case, .tm-change {
    break-inside: avoid;
  }
  .tm-panel-title, .tm-subhead, h3.tm-col-head, summary { break-after: avoid; }
  summary { list-style: none; cursor: default; }
  summary::-webkit-details-marker { display: none; }
}
</style>
</head>
<body>
<pre id="tm-errors" hidden></pre>
<main class="tm-page">
  <header id="tm-header">
    <div class="tm-head">
      <div class="tm-head-text">
        <h1 class="tm-title" id="tm-title"></h1>
        <div class="tm-meta" id="tm-meta"></div>
      </div>
      <div class="tm-actions">
        <div class="tm-buttons">
          <button type="button" class="tm-button" id="tm-png"></button>
          <button type="button" class="tm-button" id="tm-print"></button>
        </div>
        <div class="tm-note" id="tm-note" aria-live="polite"></div>
      </div>
    </div>
    <div class="tm-thesis" id="tm-thesis">
      <div class="tm-label" id="tm-thesis-label"></div>
      <div class="tm-thesis-text" id="tm-thesis-text"></div>
    </div>
    <div class="tm-questions-block" id="tm-questions-block">
      <div class="tm-label" id="tm-questions-label"></div>
      <ul class="tm-questions" id="tm-questions"></ul>
    </div>
  </header>

  <section class="tm-panel" id="tm-changes" hidden>
    <h2 class="tm-panel-title" id="tm-changes-title"></h2>
    <div id="tm-changes-body"></div>
    <p class="tm-hint" id="tm-versions"></p>
  </section>

  <section class="tm-panel" id="tm-flow">
    <h2 class="tm-panel-title" id="tm-flow-title"></h2>
    <p class="tm-hint" id="tm-flow-hint"></p>
    <div class="tm-flow-pair" id="tm-flow-pair">
      <div id="tm-flow-before" hidden>
        <h3 class="tm-col-head" id="tm-flow-before-head"></h3>
        <div class="tm-cards" id="tm-cards-before"></div>
      </div>
      <div id="tm-flow-now">
        <h3 class="tm-col-head" id="tm-flow-now-head" hidden></h3>
        <div class="tm-cards" id="tm-cards"></div>
      </div>
    </div>
  </section>

  <section class="tm-panel" id="tm-map-panel">
    <h2 class="tm-panel-title" id="tm-map-title"></h2>
    <p class="tm-hint" id="tm-map-legend"></p>
    <p class="tm-hint" id="tm-compare-legend" hidden></p>
    <div class="tm-map-scroll" id="tm-map-scroll">
      <div class="tm-map-head" id="tm-map-before-head" hidden></div>
      <svg id="tm-map-before" class="tm-svg" role="group" hidden></svg>
      <svg id="tm-links" class="tm-svg" aria-hidden="true" hidden></svg>
      <div class="tm-map-head" id="tm-map-now-head" hidden></div>
      <svg id="tm-map" class="tm-svg" role="group"></svg>
    </div>
    <div class="tm-detail is-empty" id="tm-detail"></div>
    <details class="tm-list" id="tm-list">
      <summary id="tm-list-summary"></summary>
      <div class="tm-rows" id="tm-rows"></div>
    </details>
  </section>

  <section class="tm-panel" id="tm-cases">
    <h2 class="tm-panel-title" id="tm-cases-title"></h2>
    <p class="tm-hint" id="tm-cases-hint"></p>
    <div class="tm-cases-list" id="tm-cases-list"></div>
  </section>

  <section class="tm-panel">
    <details id="tm-gaps">
      <summary id="tm-gaps-summary"></summary>
      <div id="tm-gaps-body"></div>
    </details>
  </section>

  <footer class="tm-footer" id="tm-footer"></footer>
</main>
<script>
// The renderer comes before the data element and draws once the whole file has been read.
// In a page filled in by hand, an unescaped comment opener in the data can make the data
// element run on to the end of the file. The renderer then still runs, and says that it
// found no analysis, instead of leaving the page blank.
document.addEventListener("DOMContentLoaded", function () {
  "use strict";

  // --- Errors -------------------------------------------------------------------------------
  // Anything that goes wrong is written into the box at the top of the page, so that a broken
  // page says why instead of showing half a map.

  const errorBox = document.getElementById("tm-errors");

  function showError(message) {
    errorBox.hidden = false;
    errorBox.appendChild(document.createTextNode(String(message) + "\n"));
  }

  window.onerror = function (message, source, line, column, error) {
    showError(error && error.stack ? error.stack : message + (line ? " (line " + line + ")" : ""));
  };
  window.addEventListener("unhandledrejection", function (event) {
    const reason = event.reason;
    showError(reason && reason.stack ? reason.stack : "Unhandled rejection: " + reason);
  });

  // --- Layout and colours -------------------------------------------------------------------

  const SVG_NS = "http://www.w3.org/2000/svg";
  const LAYOUT = Object.freeze({
    CONTENT_MAX: 1080,                 // the widest the content gets, in px
    LABEL_W: 120,                      // the column of thread names on the left of the map
    COL_MIN: 14,                       // a map column is 14 to 36 px wide; below 14 the map scrolls
    COL_MAX: 36,
    BAND_H: 20,                        // the section bands along the top
    LANE_GAP: 26,                      // from one row of the map to the next
    MARK_R: Object.freeze({ major: 5, minor: 3 }),
    LINKS_H: 36,                       // the strip between the two maps of a comparison
    LINKS_Y: Object.freeze({ before: 5, from: 10, to: 26, now: 31 }),   // where things sit in it
  });
  const HUES = Object.freeze({ question: "#1D9E75", concept: "#7F77DD" });
  const NEUTRAL_HUE = "#8a887f";       // a question no thread follows; a lane of neither kind
  // What each badge on the strip between the two maps shows (the minus is U+2212).
  const BADGE_GLYPHS = Object.freeze({ added: "+", removed: "−", split: "÷", merged: "∪" });

  // --- Strings ------------------------------------------------------------------------------
  // A string is looked up in the analysis's ui_strings, then in the table of its ui_language,
  // then in English. A key ending in _1 is used when the number is 1.

  const STRINGS = {
    en: {
      thesis: "Thesis",
      questions: "Questions",
      flow: "Section flow",
      flow_hint: "One line per section, then its paragraphs' roles in order. Click a role to find it on the map.",
      map: "Thread map",
      map_legend: "Large dot = main point · small dot = brief mention · solid line = consecutive paragraphs · dashed line = the thread rests · click a thread name to isolate it",
      poster_legend: "Large dot = main point · small dot = brief mention · solid line = consecutive paragraphs · dashed line = the thread rests",
      detail_hint: "Hover or click a paragraph, a dot or a role to see its summary and evidence.",
      list_toggle: "All paragraphs",
      cases: "Recurring examples",
      cases_hint: "Click to highlight where each appears.",
      gaps: "Gaps",
      gaps_toggle: "click to expand",
      computed: "Seen by counting",
      direction: "Direction",
      threads: "Threads",
      major: "main point",
      minor: "brief mention",
      png: "Save PNG",
      print: "Print",
      footer_offline: "Opens without an internet connection",
      warn_quote: "Quote not found in the paragraph",
      obs_quiet: "{lane} rests for {n} paragraphs ({from}–{to})",
      obs_unresolved: "{lane} does not return in the last section",
      obs_unthreaded: "{at} is on no thread",
      table_prefix: "T",
      figure_prefix: "F",
      inferred: "inferred",
      "role.problem": "Problem",
      "role.thesis": "Thesis",
      "role.context": "Context",
      "role.claim": "Claim",
      "role.evidence": "Evidence",
      "role.example": "Example",
      "role.counter": "Counterpoint",
      "role.implication": "Implication",
      "role.framework": "Framework",
      "role.transition": "Transition",
      "role.synthesis": "Synthesis",
      "role.conclusion": "Conclusion",
      para_row: "Paragraph",
      n_paragraphs: "{n} paragraphs",
      n_paragraphs_1: "{n} paragraph",
      n_words: "{n} words",
      n_words_1: "{n} word",
      version: "analysis v{v}",
      list_count: "{n} paragraphs",
      list_count_1: "{n} paragraph",
      list_count_and: "{n} paragraphs and {extra}",
      list_count_and_1: "{n} paragraph and {extra}",
      n_items: "({n})",
      none: "none",
      data_file: "Data file",

      compare_legend: "가는 선은 서로 맞는 문단을 이어요. 선에 마우스를 올리면 얼마나 같은지 보여요 · + 새 문단 · − 빠진 문단 · ÷ 나뉜 문단 · ∪ 합친 문단",

  // --- The data -----------------------------------------------------------------------------

  function isObject(value) {
    return value !== null && typeof value === "object" && !Array.isArray(value);
  }
  function has(object, key) {
    return Object.prototype.hasOwnProperty.call(object, key);
  }
  function asText(value) {
    if (typeof value === "string") return value;
    return value === null || value === undefined ? "" : String(value);
  }
  function listOf(value) {
    return Array.isArray(value) ? value : [];
  }

  // Without readable data there is no ui_language either, so the message follows the
  // language of the browser. The empty panels are hidden: the message is all there is.
  function showNoAnalysis(detail) {
    const language = asText(navigator.language).toLowerCase().split(/[-_]/)[0];
    const strings = has(STRINGS, language) ? STRINGS[language] : STRINGS.en;
    document.querySelector("main").hidden = true;
    showError(strings.no_data + "\n(" + detail + ")");
  }

  let data = null;
  let unreadable = "the data is not an object";
  try {
    data = JSON.parse(document.getElementById("throughmap-data").textContent);
  } catch (error) {
    unreadable = error.message;        // no data element, or text that is no JSON
  }
  if (!isObject(data)) {
    showNoAnalysis(unreadable);
    return;
  }

  const essay = isObject(data.essay) ? data.essay : {};
  const uiLanguage = asText(data.ui_language) || "en";
  const languageKey = uiLanguage.toLowerCase().split(/[-_]/)[0];
  const builtIn = has(STRINGS, languageKey) ? STRINGS[languageKey] : STRINGS.en;
  const stringLayers = [isObject(data.ui_strings) ? data.ui_strings : {}, builtIn, STRINGS.en];

  // What the page draws of one version of the analysis: its items, threads, questions and
  // sections, and the runs of its threads. The page reads its own data with this, and so the
  // earlier version that a comparison carries, which build vouches for less than for the page's
  // own data. Whatever is missing or of the wrong kind is left out.
  function modelOf(raw) {
    const source = isObject(raw) ? raw : {};

    const items = [];                  // the paragraphs, tables and figures, in document order
    const itemById = new Map();
    listOf(source.paragraphs).forEach(function (entry) {
      if (!isObject(entry) || entry.id === undefined || entry.id === null) return;
      const id = String(entry.id);
      if (itemById.has(id)) return;
      const item = {
        id: id,
        index: items.length,
        kind: entry.kind === "table" || entry.kind === "figure" ? entry.kind : "paragraph",
        section: asText(entry.section),
        text: entry.text,
        role: asText(entry.role),
        label: asText(entry.label),
        evidence: entry.evidence,
        lanes: isObject(entry.lanes) ? entry.lanes : {},
      };
      items.push(item);
      itemById.set(id, item);
    });

    const lanes = [];                  // the threads, in the order of the analysis
    const laneById = new Map();
    listOf(source.lanes).forEach(function (entry) {
      if (!isObject(entry) || entry.id === undefined || entry.id === null) return;
      const id = String(entry.id);
      if (laneById.has(id)) return;
      const kind = entry.kind === "question" || entry.kind === "concept" ? entry.kind : "";
      const lane = {
        id: id,
        kind: kind,
        label: asText(entry.label) || id,
        sub: asText(entry.sub),
        question: asText(entry.question),
        hue: HUES[kind] || NEUTRAL_HUE,
      };
      // A question thread goes by its question (Q1) and then its label; a concept thread by its
      // label and then its sub-label, as the approved layout names them.
      if (kind === "question" && lane.question) {
        lane.name = lane.question;
        lane.desc = lane.label !== lane.question ? lane.label : lane.sub;
      } else {
        lane.name = lane.label;
        lane.desc = lane.sub;
      }
      lanes.push(lane);
      laneById.set(id, lane);
    });

    const questions = listOf(source.questions).filter(isObject).map(function (entry) {
      return { id: asText(entry.id), text: asText(entry.text) };
    });
    const sections = listOf(source.sections).filter(isObject).map(function (entry) {
      return {
        id: asText(entry.id),
        short: asText(entry.short),
        title: asText(entry.title),
        inferred: entry.inferred === true,
        first: asText(entry.first),
        last: asText(entry.last),
        conclusion: asText(entry.conclusion),
        baton: asText(entry.baton),
        answers: listOf(entry.answers).map(asText),
      };
    });
    const sectionById = new Map(sections.map(function (section) { return [section.id, section]; }));
    const model = {
      items: items,
      itemById: itemById,
      lanes: lanes,
      laneById: laneById,
      questions: questions,
      sections: sections,
      sectionById: sectionById,
      paragraphCount: items.filter(function (item) { return item.kind === "paragraph"; }).length,
    };
    // build works the runs out (computed in vN.json); without them the page does, as tm_build does.
    const computed = isObject(source.computed) ? source.computed : null;
    model.runs = computed && isObject(computed.runs) ? computed.runs : computeRuns(model);
    return model;
  }

  const now = modelOf(data);           // the version this page is of
  // The comparison with an earlier version, when build made one: what differs, and the earlier
  // version itself. One without that version has nothing to be compared with, and is left out.
  const compare = isObject(data.compare) && isObject(data.compare.before) ? data.compare : null;
  const before = compare && modelOf(compare.before);
  const cases = listOf(data.cases).filter(isObject).map(function (raw) {
    return { name: asText(raw.name), at: listOf(raw.at).map(asText), note: asText(raw.note) };
  });
  const gaps = listOf(data.gaps).filter(isObject).map(function (raw) {
    return { note: asText(raw.note), direction: asText(raw.direction) };
  });
  const hasVersion = typeof data.version === "number"
    || (typeof data.version === "string" && data.version !== "");
  const quoteLanguage = asText(essay.language) || null;   // quotes stay in the draft's language

  function marks(item, laneId) {
    return has(item.lanes, laneId);
  }

  // --- Words --------------------------------------------------------------------------------

  function lookup(key, number) {
    for (const layer of stringLayers) {
      if (number === 1 && has(layer, key + "_1") && typeof layer[key + "_1"] === "string") {
        return layer[key + "_1"];
      }
      if (has(layer, key) && typeof layer[key] === "string") return layer[key];
    }
    return null;
  }
  function t(key) {
    const found = lookup(key);
    return found === null ? key : found;
  }
  function fill(template, values) {
    return template.replace(/\{(\w+)\}/g, function (whole, name) {
      return has(values, name) ? String(values[name]) : whole;
    });
  }
  function formatNumber(number) {
    const value = Number(number);
    if (!isFinite(value)) return asText(number);
    try {
      return value.toLocaleString(builtIn === STRINGS.ko ? "ko" : "en");
    } catch (error) {
      return String(value);
    }
  }
  // The string for a count, such as "6 paragraphs": the _1 form when the number is 1.
  function counted(key, number, values) {
    const template = lookup(key, number);
    const all = Object.assign({ n: formatNumber(number) }, values);
    return fill(template === null ? key : template, all);
  }
  function roleName(role) {
    const found = lookup("role." + role);
    return found === null ? role : found;
  }
  function weightName(weight) {
    return weight === "major" || weight === "minor" ? t(weight) : asText(weight);
  }
  // How an id reads on the page: tables and figures take the prefix of the UI language (T1, 표1).
  // ``model`` is the version the id belongs to: this page's, or the earlier one of a comparison.
  function shownId(id, model = now) {
    id = asText(id);
    const item = model.itemById.get(id);
    let kind = item ? item.kind : "paragraph";
    if (!item && /^T\d/.test(id)) kind = "table";
    if (!item && /^F\d/.test(id)) kind = "figure";
    if (kind === "table") return t("table_prefix") + id.replace(/^T/, "");
    if (kind === "figure") return t("figure_prefix") + id.replace(/^F/, "");
    return id;
  }
  function laneName(laneId, model = now) {
    const lane = model.laneById.get(asText(laneId));
    return lane ? lane.name : asText(laneId);
  }
  // Ids written one after another. ``show`` is shownId, or oldId for the ids of the earlier
  // version. It is called with the id alone: ids.map(shownId) would hand shownId the index as a
  // second argument, which it would take for a model.
  function joinIds(ids, show, separator) {
    return listOf(ids).map(function (id) { return show(id); }).join(separator);
  }
  function quoted(text) {
    return "“" + asText(text) + "”";
  }

  // --- The quote check ----------------------------------------------------------------------
  // The same comparison as tm_text.normalize and contains_verbatim in the script, step by step:
  // drop the format characters (Unicode category Cf), compose to NFC, turn typographic quotes,
  // dashes, the ellipsis and narrow spaces plain, collapse each run of whitespace (what Python's
  // \s matches) to one space and trim. Case counts.

  const FORMAT_CHARACTERS = /\p{Cf}/gu;
  const TYPOGRAPHY = new Map();        // the table _TYPOGRAPHY_TO_PLAIN, by code point
  [
    [[0x2018, 0x2019, 0x201A, 0x201B, 0x2032], "'"],
    [[0x201C, 0x201D, 0x201E, 0x201F, 0x2033], "\""],
    [[0x2013, 0x2014, 0x2015, 0x2212, 0x2012], "-"],
    [[0x2026], "..."],
    [[0x00A0, 0x2009, 0x202F, 0x2007], " "],
  ].forEach(function (entry) {
    entry[0].forEach(function (code) { TYPOGRAPHY.set(String.fromCharCode(code), entry[1]); });
  });
  const PYTHON_WHITESPACE = new Set([   // every character that Python's \s matches
    0x09, 0x0A, 0x0B, 0x0C, 0x0D, 0x1C, 0x1D, 0x1E, 0x1F, 0x20, 0x85, 0xA0, 0x1680,
    0x2000, 0x2001, 0x2002, 0x2003, 0x2004, 0x2005, 0x2006, 0x2007, 0x2008, 0x2009, 0x200A,
    0x2028, 0x2029, 0x202F, 0x205F, 0x3000,
  ].map(function (code) { return String.fromCharCode(code); }));

  function normalize(text) {
    const composed = String(text).replace(FORMAT_CHARACTERS, "").normalize("NFC");
    let out = "";
    let space = false;
    for (const char of composed) {
      const plain = TYPOGRAPHY.has(char) ? TYPOGRAPHY.get(char) : char;
      for (const part of plain) {
        if (PYTHON_WHITESPACE.has(part)) {
          space = true;
        } else {
          if (space && out) out += " ";
          space = false;
          out += part;
        }
      }
    }
    return out;
  }
  function containsVerbatim(haystack, needle) {
    if (typeof haystack !== "string" || typeof needle !== "string") return false;
    const wanted = normalize(needle);
    return wanted.length > 0 && normalize(haystack).indexOf(wanted) !== -1;
  }

  // The quotes that fail, per item: [{lane: lane id, or null for the evidence, quote}].
  const badQuotes = new Map();
  now.items.forEach(function (item) {
    const bad = [];
    if (!containsVerbatim(item.text, item.evidence)) bad.push({ lane: null, quote: item.evidence });
    Object.keys(item.lanes).forEach(function (laneId) {
      const mark = item.lanes[laneId];
      const quote = isObject(mark) ? mark.quote : undefined;
      if (!containsVerbatim(item.text, quote)) bad.push({ lane: laneId, quote: quote });
    });
    if (bad.length) badQuotes.set(item.id, bad);
  });

  // --- Runs and observations ----------------------------------------------------------------
  // build works these out (computed in vN.json). A page that an agent filled in without Python
  // has none, so the page works them out the same way as tm_build does.

  function computeRuns(model) {
    const runs = {};
    model.lanes.forEach(function (lane) {
      const stretches = [];
      let stretch = null;
      model.items.forEach(function (item) {
        if (!marks(item, lane.id)) {
          stretch = null;
          return;
        }
        if (!stretch) {
          stretch = [];
          stretches.push(stretch);
        }
        stretch.push(item.id);
      });
      if (!stretches.length) return;
      const lastStretch = stretches[stretches.length - 1];
      runs[lane.id] = {
        span: [stretches[0][0], lastStretch[lastStretch.length - 1]],
        solid: stretches.filter(function (ids) { return ids.length >= 2; }),
      };
    });
    return runs;
  }

  function computeObservations() {
    const paragraphs = now.items.filter(function (item) { return item.kind === "paragraph"; });
    const markedLanes = now.lanes.map(function (lane) { return lane.id; }).filter(function (laneId) {
      return now.items.some(function (item) { return marks(item, laneId); });
    });
    const shortest = Math.max(6, Math.ceil(0.25 * paragraphs.length));
    const found = [];
    markedLanes.forEach(function (laneId) {
      let lastMark = null;
      let resting = 0;
      now.items.forEach(function (item) {
        if (marks(item, laneId)) {
          if (lastMark !== null && resting >= shortest) {
            found.push({ type: "quiet", lane: laneId, from: lastMark, to: item.id,
                         length: resting });
          }
          lastMark = item.id;
          resting = 0;
        } else if (item.kind === "paragraph") {
          resting += 1;
        }
      });
    });
    if (now.sections.length) {
      const lastSection = now.sections[now.sections.length - 1].id;
      const returning = new Set();
      paragraphs.forEach(function (item) {
        if (item.section !== lastSection) return;
        Object.keys(item.lanes).forEach(function (laneId) { returning.add(laneId); });
      });
      markedLanes.forEach(function (laneId) {
        if (!returning.has(laneId)) found.push({ type: "unresolved", lane: laneId });
      });
    }
    paragraphs.forEach(function (item) {
      if (!Object.keys(item.lanes).length && item.role !== "transition") {
        found.push({ type: "unthreaded", at: [item.id] });
      }
    });
    return found;
  }

  const computed = isObject(data.computed) ? data.computed : null;
  const observations = computed && Array.isArray(computed.observations)
    ? computed.observations : computeObservations();

  // --- Building elements --------------------------------------------------------------------
  // h() makes an HTML element and s() an SVG one. Text from the analysis goes in as text nodes
  // only, and attributes through setAttribute, so markup in a draft stays text.

  function setAttributes(node, attributes) {
    if (!attributes) return node;
    Object.keys(attributes).forEach(function (name) {
      const value = attributes[name];
      if (value === null || value === undefined || value === false) return;
      node.setAttribute(name, value === true ? "" : String(value));
    });
    return node;
  }
  function append(node, children) {
    if (children === null || children === undefined) return node;
    (Array.isArray(children) ? children : [children]).forEach(function (child) {
      if (child === null || child === undefined || child === false) return;
      node.appendChild(typeof child === "object" ? child : document.createTextNode(String(child)));
    });
    return node;
  }
  function h(tag, attributes, children) {
    return append(setAttributes(document.createElement(tag), attributes), children);
  }
  function s(tag, attributes, children) {
    return append(setAttributes(document.createElementNS(SVG_NS, tag), attributes), children);
  }
  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }
  function setText(id, text) {
    document.getElementById(id).textContent = text;
  }
  function dot(hue) {
    const span = h("span", { class: "tm-dot", "aria-hidden": "true" });
    span.style.background = hue;
    return span;
  }
  function px(value) {
    return String(Math.round(value * 100) / 100);
  }
  function clamp(value, low, high) {
    return Math.min(high, Math.max(low, value));
  }

  // A question is teal when a question thread follows it, purple when only concept threads do.
  function questionHue(questionId, model) {
    const followedBy = function (kind) {
      return model.lanes.some(function (lane) {
        return lane.kind === kind && lane.question === questionId;
      });
    };
    if (followedBy("question")) return HUES.question;
    if (followedBy("concept")) return HUES.concept;
    return NEUTRAL_HUE;
  }

  function warnBadge(itemId) {
    return h("span", {
      class: "tm-warn", "data-item": itemId, title: t("warn_quote"), role: "img",
      "aria-label": t("warn_quote"),
    }, "!");
  }

  // --- Header -------------------------------------------------------------------------------

  // The line under the title: the draft's file, its paragraphs and words, and the version.
  function metaText() {
    const meta = [];
    if (essay.source) meta.push(asText(essay.source));
    meta.push(counted("n_paragraphs", now.paragraphCount));
    if (typeof essay.word_count === "number") meta.push(counted("n_words", essay.word_count));
    if (hasVersion) meta.push(fill(t("version"), { v: data.version }));
    return meta.join(" · ");
  }

  // A question without a thread of its own is judged through the concept threads that help
  // answer it: "judged by A·B". "" for any other question.
  function judgedBy(question) {
    const ownLane = now.lanes.some(function (lane) {
      return lane.kind === "question" && lane.question === question.id;
    });
    const helpers = now.lanes.filter(function (lane) {
      return lane.kind === "concept" && lane.question === question.id;
    });
    if (ownLane || !helpers.length) return "";
    const names = helpers.map(function (lane) { return lane.name; });
    return fill(t("judged_by"), { lanes: names.join("·") });
  }

  function renderHeader() {
    const title = asText(essay.title);
    document.title = title ? title + " · throughmap" : "throughmap";
    document.documentElement.setAttribute("lang", uiLanguage);
    setText("tm-title", title);
    setText("tm-meta", metaText());

    setText("tm-png", t("png"));
    setText("tm-print", t("print"));

    const thesis = asText(data.thesis);
    document.getElementById("tm-thesis").hidden = !thesis;
    setText("tm-thesis-label", t("thesis"));
    setText("tm-thesis-text", thesis);

    const list = document.getElementById("tm-questions");
    document.getElementById("tm-questions-block").hidden = !now.questions.length;
    setText("tm-questions-label", t("questions"));
    now.questions.forEach(function (question) {
      const entry = h("li", { "data-question": question.id }, [
        dot(questionHue(question.id, now)), h("span", { class: "tm-q-id" }, question.id),
        question.text,
      ]);
      const note = judgedBy(question);
      if (note) entry.appendChild(h("span", { class: "tm-q-note" }, note));
      list.appendChild(entry);
    });
  }

  // --- What changed -------------------------------------------------------------------------
  // build writes the comparison into the data (compare): the earlier version itself, and what
  // differs between the two. The panel after the header says it in words, and an item's detail
  // box says where that item came from. An id of the earlier version carries its version, as in
  // "v1 P8", so that it is not taken for an id of this one. The comparison is read as
  // defensively as the rest of the data.

  function oldId(id) {
    return "v" + asText(compare.against) + " " + shownId(id, before);
  }

  // The lines between the two maps: one for each pair of matched paragraphs, and one for each
  // part of a split and each part of a merge ({old, new, kind, ratio, edited}, where kind is
  // "pair", "split" or "merge", the ratio of a split or a merge is null and only a pair is edited).
  // They run in the order of this version's items, then of the earlier one's. A line with an end
  // on no map is left out.
  function linksOf(changes) {
    if (!isObject(changes) || !before) return [];
    const found = [];
    const add = function (old, current, kind, ratio, edited) {
      found.push({
        old: asText(old), new: asText(current), kind: kind, ratio: ratio, edited: edited === true,
      });
    };
    listOf(changes.pairs).filter(isObject).forEach(function (pair) {
      add(pair.old, pair.new, "pair", typeof pair.ratio === "number" ? pair.ratio : null,
        pair.edited);
    });
    listOf(changes.splits).filter(isObject).forEach(function (split) {
      listOf(split.new).forEach(function (part) { add(split.old, part, "split", null); });
    });
    listOf(changes.merges).filter(isObject).forEach(function (merge) {
      listOf(merge.old).forEach(function (part) { add(part, merge.new, "merge", null); });
    });
    return found.filter(function (link) {
      return now.itemById.has(link.new) && before.itemById.has(link.old);
    }).sort(function (a, b) {
      return now.itemById.get(a.new).index - now.itemById.get(b.new).index
        || before.itemById.get(a.old).index - before.itemById.get(b.old).index;
    });
  }

  // How closely the paragraphs of a pair match, in whole percent. build rounds the ratio to two
  // decimals, so a long paragraph with one word changed has a ratio of 1; an edited pair is held
  // at 99, so that it never reads 100 next to "Edited".
  function matchPercent(link) {
    const percent = Math.round(link.ratio * 100);
    return link.edited ? Math.min(percent, 99) : percent;
  }

  function linksBy(links, end) {
    const groups = new Map();
    links.forEach(function (link) {
      if (!groups.has(link[end])) groups.set(link[end], []);
      groups.get(link[end]).push(link);
    });
    return groups;
  }
  const links = linksOf(compare);
  const linksTo = linksBy(links, "new");   // this version's id -> the lines that end in it
  const linksFrom = linksBy(links, "old"); // the earlier version's id -> the lines that start in it

  // The panel's lines in the four groups under its headings, as [{title, lines: [{kind, text}]}],
  // where kind is the line's data-change. A kind that the comparison has nothing for has no
  // line. The edited, added and removed paragraphs, and the new and the dropped threads, are
  // each listed on one line. Each split, merge, move, thread mark, quiet stretch and gap has a
  // line of its own, so that an old id stays with the new one it became.
  function changeGroups() {
    const pairs = listOf(compare.pairs).filter(isObject);
    const laneChanges = isObject(compare.lanes) ? compare.lanes : {};
    const line = function (kind, key, values) {
      return { kind: kind, text: fill(t(key), values) };
    };
    const nowIds = function (ids) { return joinIds(ids, shownId, ", "); };
    const oldIds = function (ids) { return joinIds(ids, oldId, ", "); };
    const nowLanes = function (ids) {
      return joinIds(ids, function (id) { return laneName(id, now); }, ", ");
    };
    const oldLanes = function (ids) {
      return joinIds(ids, function (id) { return laneName(id, before); }, ", ");
    };

    const paragraphs = [];
    const edited = pairs.filter(function (pair) { return pair.edited === true; })
      .map(function (pair) { return pair.new; });
    if (edited.length) paragraphs.push(line("edited", "change_edited", { ids: nowIds(edited) }));
    if (listOf(compare.added).length) {
      paragraphs.push(line("added", "change_added", { ids: nowIds(compare.added) }));
    }
    if (listOf(compare.removed).length) {
      paragraphs.push(line("removed", "change_removed", { ids: oldIds(compare.removed) }));
    }
    listOf(compare.splits).filter(isObject).forEach(function (split) {
      paragraphs.push(line("split", "change_split",
                           { old: oldId(split.old), new: nowIds(split.new) }));
    });
    listOf(compare.merges).filter(isObject).forEach(function (merge) {
      paragraphs.push(line("merged", "change_merged",
                           { old: oldIds(merge.old), new: shownId(merge.new) }));
    });
    pairs.filter(function (pair) { return pair.moved === true; }).forEach(function (pair) {
      paragraphs.push(line("moved", "change_moved",
                           { old: oldId(pair.old), new: shownId(pair.new) }));
    });

    // A thread mark gained is named by this version's threads, and one lost by the earlier
    // version's: "+ Q1 · − Pace" (the sign is U+2212, the minus). The paragraph is named by
    // its id in this version, then by its id in the earlier one when that differs.
    const threads = [];
    listOf(compare.marks).filter(isObject).forEach(function (mark) {
      const gained = listOf(mark.gained).map(function (id) { return "+ " + laneName(id, now); });
      const lost = listOf(mark.lost).map(function (id) {
        return "\u2212 " + laneName(id, before);
      });
      if (!gained.length && !lost.length) return;
      const paragraph = shownId(mark.new)
        + (asText(mark.old) === asText(mark.new) ? "" : " (" + oldId(mark.old) + ")");
      threads.push(line("marks", "change_marks", {
        id: paragraph, marks: [gained.join(", "), lost.join(", ")].filter(Boolean).join(" · "),
      }));
    });
    if (listOf(laneChanges.added).length) {
      threads.push(line("thread-added", "change_thread_added",
                        { lanes: nowLanes(laneChanges.added) }));
    }
    if (listOf(laneChanges.removed).length) {
      threads.push(line("thread-removed", "change_thread_removed",
                        { lanes: oldLanes(laneChanges.removed) }));
    }

    const quiet = [];
    listOf(compare.quiet_closed).filter(isObject).forEach(function (stretch) {
      quiet.push(line("quiet-closed", "change_quiet_closed", {
        lane: laneName(stretch.lane, before), from: oldId(stretch.from), to: oldId(stretch.to),
      }));
    });
    listOf(compare.quiet_opened).filter(isObject).forEach(function (stretch) {
      quiet.push(line("quiet-opened", "change_quiet_opened", {
        lane: laneName(stretch.lane, now), n: formatNumber(stretch.length),
        from: shownId(stretch.from), to: shownId(stretch.to),
      }));
    });

    const closed = [];
    listOf(compare.gaps_closed).filter(isObject).forEach(function (gap) {
      closed.push(line("gap", "change_gap", { note: asText(gap.note), at: oldIds(gap.at) }));
    });

    return [
      { title: t("changes_paragraphs"), lines: paragraphs },
      { title: t("threads"), lines: threads },
      { title: t("changes_quiet"), lines: quiet },
      { title: t("changes_gaps"), lines: closed },
    ];
  }

  // The saved versions, each with its date and size and a note on the two the page is about:
  // "v1 (2026-10-22, 8 paragraphs, compared) · v2 (…, this map)". A version that could not be
  // read has no date to show, and is only named. "" when the comparison lists none.
  function versionsText() {
    const entries = [];
    listOf(compare.versions).filter(isObject).forEach(function (entry) {
      const number = asText(entry.version);
      if (!number) return;
      const details = [];
      if (typeof entry.generated_at === "string") {
        const date = Array.from(entry.generated_at).slice(0, 10).join("");
        if (date) details.push(date);
        if (typeof entry.paragraphs === "number") {
          details.push(counted("n_paragraphs", entry.paragraphs));
        }
      }
      if (number === asText(data.version)) details.push(t("version_this"));
      else if (number === asText(compare.against)) details.push(t("version_compared"));
      entries.push("v" + number + (details.length ? " (" + details.join(", ") + ")" : ""));
    });
    return entries.length ? fill(t("versions"), { list: entries.join(" · ") }) : "";
  }

  // The panel shows only when there is a comparison: a title, the changes in their groups (or
  // one line saying there are none), and the list of saved versions.
  function renderChanges() {
    document.getElementById("tm-changes").hidden = !compare;
    if (!compare) return;
    setText("tm-changes-title", fill(t("changes_title"), { v: asText(compare.against) }));
    const body = document.getElementById("tm-changes-body");
    const groups = changeGroups().filter(function (group) { return group.lines.length > 0; });
    if (!groups.length) {
      body.appendChild(h("div", { class: "tm-change", "data-change": "none" }, t("changes_none")));
    }
    groups.forEach(function (group) {
      body.appendChild(h("h3", { class: "tm-subhead" }, group.title));
      group.lines.forEach(function (entry) {
        body.appendChild(h("div", { class: "tm-change", "data-change": entry.kind }, entry.text));
      });
    });
    const versions = versionsText();
    setText("tm-versions", versions);
    document.getElementById("tm-versions").hidden = !versions;
  }

  // Where an item of this version came from, for the foot of its detail box: "Before: v1 P3, 83%
  // match", for a pair, with " · moved" when it moved; "Before: v1 P2, split into P2, P3"; "Before:
  // v1 P5, v1 P6, merged into this one"; or "New since v1". "" for an item the comparison does
  // not mention.
  function originText(item) {
    if (!compare) return "";
    const own = linksTo.get(item.id);
    if (!own) {
      const isNew = listOf(compare.added).some(function (id) { return asText(id) === item.id; });
      return isNew ? fill(t("detail_new"), { v: asText(compare.against) }) : "";
    }
    const link = own[0];
    if (link.kind === "split") {
      const parts = linksFrom.get(link.old).filter(function (other) {
        return other.kind === "split";
      });
      return fill(t("detail_split"), {
        old: oldId(link.old),
        new: joinIds(parts.map(function (part) { return part.new; }), shownId, ", "),
      });
    }
    if (link.kind === "merge") {
      return fill(t("detail_merged"), {
        old: joinIds(own.map(function (part) { return part.old; }), oldId, ", "),
      });
    }
    if (link.ratio === null || !isFinite(link.ratio)) return "";
    const said = fill(t("detail_pair"), { old: oldId(link.old), pct: matchPercent(link) });
    const moved = listOf(compare.pairs).some(function (pair) {
      return isObject(pair) && pair.moved === true && asText(pair.new) === item.id;
    });
    return moved ? said + " · " + t("detail_moved") : said;
  }

  // --- Section flow -------------------------------------------------------------------------

  const roleButtons = new Map();       // item id -> its role button in the section cards

  // The items of ``model`` that belong to ``section``, in order.
  function itemsOf(model, section) {
    return model.items.filter(function (item) { return item.section === section.id; });
  }

  function rangeOf(section, model) {
    if (!section.first) return "";
    if (!section.last || section.last === section.first) return shownId(section.first, model);
    return fill(t("range"), {
      first: shownId(section.first, model), last: shownId(section.last, model),
    });
  }

  function sectionHead(section, model) {
    const head = h("div", { class: "tm-sec-head" },
      h("span", { class: "tm-short" }, section.short || section.id));
    const range = rangeOf(section, model);
    if (section.title && section.title !== section.short) append(head, " · " + section.title);
    if (range) append(head, " · " + range);
    if (section.inferred) append(head, h("span", { class: "tm-inferred" }, t("inferred")));
    return head;
  }

  // Each role is a step that keeps its arrow to the next one, so a wrapped line ends in "→". In
  // this version the roles are buttons that find their paragraph on the map, and carry the
  // warning for a quote that is not in the text; in the earlier version of a comparison they
  // are only text.
  function roleSequence(section, model, interactive) {
    const sequence = h("div", { class: "tm-seq" });
    const sectionItems = itemsOf(model, section);
    sectionItems.forEach(function (item, position) {
      const text = shownId(item.id, model) + " " + roleName(item.role);
      let role;
      if (interactive) {
        role = h("button", {
          class: "tm-role", "data-item": item.id, title: item.label || null, type: "button",
          "aria-pressed": "false",
        }, text);
        role.addEventListener("click", function () { pressRole(item.id); });
        roleButtons.set(item.id, role);
      } else {
        role = h("span", {
          class: "tm-role-before", "data-item": item.id, title: item.label || null,
        }, text);
      }
      const last = position === sectionItems.length - 1;
      sequence.appendChild(h("span", { class: "tm-step" }, [
        role,
        interactive && badQuotes.has(item.id) ? warnBadge(item.id) : null,
        last ? null : h("span", { class: "tm-arrow", "aria-hidden": "true" }, " →"),
      ]));
      if (!last) append(sequence, " ");
    });
    return sequence;
  }

  // A section's card: its head, conclusion and roles on the left, the questions it answers on
  // the right. ``number`` is the section's place among those of ``model``.
  function sectionCard(section, number, model, interactive) {
    const main = h("div", { class: "tm-sec-main" }, [
      sectionHead(section, model),
      section.conclusion ? h("div", { class: "tm-concl" }, section.conclusion) : null,
      roleSequence(section, model, interactive),
    ]);
    const answers = h("div", { class: "tm-answers" }, section.answers.map(function (id) {
      return h("span", { class: "tm-chip" }, [dot(questionHue(id, model)), id]);
    }));
    return h("div", {
      class: interactive ? "tm-card" : "tm-card is-before", "data-section": section.id,
    }, [main, answers]);
  }

  // The cards of ``model``, each but the last followed by the baton that hands on to the next.
  function fillCards(container, model, interactive) {
    model.sections.forEach(function (section, number) {
      container.appendChild(sectionCard(section, number, model, interactive));
      if (number < model.sections.length - 1 && section.baton) {
        container.appendChild(h("div", { class: "tm-baton" }, "↓ " + section.baton));
      }
    });
  }

  // The head over a column or a map of a comparison: "Before · v1", "Now · v2".
  function columnHead(key, version) {
    return fill(t(key), { v: asText(version) });
  }

  // The cards of this version; with a comparison, the earlier version's too, side by side.
  function renderFlow() {
    setText("tm-flow-title", t("flow"));
    setText("tm-flow-hint", t("flow_hint"));
    fillCards(document.getElementById("tm-cards"), now, true);
    document.getElementById("tm-flow-pair").classList.toggle("is-compare", !!compare);
    if (!compare) return;
    document.getElementById("tm-flow-before").hidden = false;
    document.getElementById("tm-flow-now-head").hidden = false;
    setText("tm-flow-before-head", columnHead("before_col", compare.against));
    setText("tm-flow-now-head", columnHead("now_col", data.version));
    fillCards(document.getElementById("tm-cards-before"), before, false);
  }

  // --- Thread map ---------------------------------------------------------------------------

  let measuring = null;                // a hidden svg text element, while a drawing measures text
  let posterProbe = null;              // the poster's own text element, while the poster is drawn

  // The width of ``text`` in the style ``className``: as the page draws it, or, while the poster
  // is drawn, as the poster's own style sheet and fonts draw it.
  function measure(text, className) {
    if (!posterProbe && (!measuring || !measuring.isConnected)) {
      const box = s("svg", { class: "tm-svg tm-measure", width: 1, height: 1,
                             "aria-hidden": "true" });
      measuring = s("text", { x: 0, y: 0 });
      box.appendChild(measuring);
      document.body.appendChild(box);
    }
    const probe = posterProbe || measuring;
    probe.setAttribute("class", className);
    probe.textContent = text;
    return probe.getComputedTextLength();
  }
  function stopMeasuring() {
    if (measuring && measuring.parentNode && measuring.parentNode.parentNode) {
      measuring.parentNode.parentNode.removeChild(measuring.parentNode);
    }
    measuring = null;
  }
  // The text as it fits in ``room`` pixels: whole, or cut short with an ellipsis ({text, cut}).
  function fitText(text, room, className) {
    if (measure(text, className) <= room) return { text: text, cut: false };
    const chars = Array.from(text);
    const cutAt = function (count) { return chars.slice(0, count).join("").trimEnd() + "…"; };
    let low = 0;
    let high = chars.length - 1;
    while (low < high) {
      const middle = Math.ceil((low + high) / 2);
      if (measure(cutAt(middle), className) <= room) low = middle;
      else high = middle - 1;
    }
    return { text: cutAt(low), cut: true };
  }

  // Each run of consecutive items in the same section makes one band along the top.
  function bandsOf(model) {
    const bands = [];
    model.items.forEach(function (item, index) {
      const last = bands[bands.length - 1];
      if (last && last.section === item.section) last.end = index;
      else bands.push({ section: item.section, start: index, end: index });
    });
    return bands;
  }

  // The size of the number row: two-digit numbers need room, so narrow columns get smaller ones.
  function numberSize(width) {
    return width >= 20 ? 11 : width >= 16 ? 10 : 9;
  }
  // What a column shows on the number row: the paragraph's number, or a table's prefix and
  // number, or only the prefix when the column is too narrow for both.
  function columnLabel(item, width, model) {
    if (item.kind === "paragraph") return /^P\d+$/.test(item.id) ? item.id.slice(1) : item.id;
    const full = shownId(item.id, model);
    const fits = measure(full, "tm-num") * numberSize(width) / 11 <= width - 2;   // at 11px
    return fits ? full : t(item.kind === "table" ? "table_prefix" : "figure_prefix");
  }

  function laneTitle(lane, model) {
    const parts = [lane.name];
    if (lane.desc) parts.push(lane.desc);
    if (lane.sub && lane.sub !== lane.desc) parts.push(lane.sub);
    const question = model.questions.find(function (entry) { return entry.id === lane.question; });
    const asked = question && question.text ? "\n" + question.id + " " + question.text : "";
    return parts.join(" · ") + asked;
  }

  // ``called`` is how the item reads in the title: "P4", or "v1 P4" in the earlier version.
  function markTitle(called, lane, mark) {
    const weight = isObject(mark) ? weightName(mark.weight) : "";
    const quote = isObject(mark) ? "\n" + quoted(mark.quote) : "";
    return [called, lane.name, weight].filter(Boolean).join(" · ") + quote;
  }

  // Draw the thread map of ``model`` into ``svg``, given ``room`` pixels for all of it, the
  // column of thread names included. Each column takes an equal share of what is left, 14 to 36
  // pixels, as if the map had ``slots`` columns: the two maps of a comparison are drawn with the
  // slots of the longer one, so that their columns line up. Returns the width of a column. The
  // map of the earlier version is for looking at: its thread names are not buttons, and its
  // columns say which paragraph they are.
  function drawMap(svg, room, model = now, slots = model.items.length) {
    const L = LAYOUT;
    const earlier = model === before;
    const count = model.items.length;
    const share = Math.floor((room - L.LABEL_W) / Math.max(slots, 1) * 100) / 100;
    const column = clamp(share, L.COL_MIN, L.COL_MAX);
    const width = L.LABEL_W + count * column;
    const numberY = L.BAND_H + 12;
    const laneY = function (row) { return numberY + L.LANE_GAP * (row + 1); };
    const height = (model.lanes.length ? laneY(model.lanes.length - 1) : numberY) + 14;
    const left = function (index) { return L.LABEL_W + column * index; };
    const centre = function (index) { return left(index) + column / 2; };
    const indexOf = function (id) {
      const item = model.itemById.get(asText(id));
      return item ? item.index : -1;
    };
    const called = function (item) { return earlier ? oldId(item.id) : shownId(item.id); };

    clear(svg);
    setAttributes(svg, {
      width: px(width), height: px(height), viewBox: "0 0 " + px(width) + " " + px(height),
    });

    bandsOf(model).forEach(function (band, number) {
      const x = left(band.start);
      const bandWidth = column * (band.end - band.start + 1);
      const section = model.sectionById.get(band.section);
      const name = section ? section.short || section.id : band.section;
      const fit = fitText(name, bandWidth - 4, "tm-band");
      svg.appendChild(s("g", { class: "tm-bandg", "data-section": band.section }, [
        fit.cut ? s("title", null, name) : null,
        s("rect", {
          class: number % 2 ? "tm-bandbg is-odd" : "tm-bandbg", x: px(x), y: 0,
          width: px(bandWidth), height: L.BAND_H,
        }),
        s("text", {
          class: "tm-band", x: px(x + bandWidth / 2), y: L.BAND_H / 2,
          "text-anchor": "middle", "dominant-baseline": "central",
        }, fit.text),
      ]));
      if (number) {
        svg.appendChild(s("line", {
          class: "tm-sep", x1: px(x), y1: 0, x2: px(x), y2: px(height - 4),
        }));
      }
    });

    model.items.forEach(function (item, index) {
      const title = [called(item), roleName(item.role), item.label].filter(Boolean).join(" · ");
      svg.appendChild(s("rect", {
        class: "tm-col", "data-item": item.id, x: px(left(index)), y: L.BAND_H + 2,
        width: px(column), height: px(height - L.BAND_H - 6),
      }, earlier ? s("title", null, title) : null));
    });

    svg.appendChild(s("text", {
      class: "tm-rowlabel", x: 6, y: numberY, "dominant-baseline": "central",
    }, t("para_row")));
    model.items.forEach(function (item, index) {
      svg.appendChild(s("text", {
        class: "tm-num", "data-item": item.id, x: px(centre(index)), y: numberY,
        "text-anchor": "middle", "dominant-baseline": "central",
        style: "font-size:" + numberSize(column) + "px",
      }, columnLabel(item, column, model)));
    });

    model.lanes.forEach(function (lane, row) {
      const y = laneY(row);
      svg.appendChild(threadName(lane, y));
      svg.appendChild(threadRow(lane, y));
    });
    stopMeasuring();
    return column;

    // The name of a thread in the left column: its name in bold, then its description as far as
    // it fits. Clicking it isolates the thread.
    function threadName(lane, y) {
      const room = L.LABEL_W - 16;
      const nameFit = fitText(lane.name, room, "tm-lname-name");
      const label = s("text", {
        class: "tm-lname-text", x: 6, y: y, "dominant-baseline": "central",
      }, s("tspan", { class: "tm-lname-name" }, nameFit.text));
      const descRoom = room - measure(nameFit.text, "tm-lname-name") - 4;
      if (!nameFit.cut && lane.desc && descRoom >= 24) {
        const descFit = fitText(lane.desc, descRoom, "tm-lname-desc");
        label.appendChild(s("tspan", { class: "tm-lname-desc", dx: 4 }, descFit.text));
      }
      return s("g", earlier ? { class: "tm-lname", "data-lane": lane.id } : {
        class: "tm-lname", "data-lane": lane.id, role: "button", tabindex: 0,
        "aria-pressed": "false",
      }, [
        s("title", null, laneTitle(lane, model)),
        s("rect", { class: "tm-lname-bg", x: 0, y: y - 11, width: L.LABEL_W - 6, height: 22,
                    rx: 4 }),
        label,
      ]);
    }

    // A thread's row: a dashed line from its first mark to its last, a solid line over each
    // run of consecutive marks, and a dot per mark, large for a main point.
    function threadRow(lane, y) {
      const group = s("g", { class: "tm-lane", "data-lane": lane.id, fill: lane.hue });
      const line = function (className, from, to) {
        return s("line", {
          class: className, x1: px(centre(from)), y1: y, x2: px(centre(to)), y2: y,
          stroke: lane.hue,
        });
      };
      const run = isObject(model.runs[lane.id]) ? model.runs[lane.id] : null;
      const span = run ? listOf(run.span) : [];
      if (span.length === 2 && indexOf(span[0]) >= 0 && indexOf(span[1]) > indexOf(span[0])) {
        group.appendChild(line("tm-span", indexOf(span[0]), indexOf(span[1])));
      }
      listOf(run && run.solid).forEach(function (ids) {
        const stretch = listOf(ids);
        const from = indexOf(stretch[0]);
        const to = indexOf(stretch[stretch.length - 1]);
        if (from >= 0 && to > from) group.appendChild(line("tm-run", from, to));
      });
      model.items.forEach(function (item, index) {
        if (!marks(item, lane.id)) return;
        const mark = item.lanes[lane.id];
        const weight = isObject(mark) ? asText(mark.weight) : "";
        group.appendChild(s("circle", {
          class: "tm-mark", "data-item": item.id, "data-lane": lane.id, "data-weight": weight,
          cx: px(centre(index)), cy: y, r: weight === "major" ? L.MARK_R.major : L.MARK_R.minor,
        }, s("title", null, markTitle(called(item), lane, mark))));
      });
      return group;
    }
  }

  // The hover text of a line between the maps: "v1 P3 → P7 · 83% match" for a pair; for a part
  // of a split or a merge, the two ids and the word for it.
  function linkTitle(link) {
    const old = oldId(link.old);
    const current = shownId(link.new);
    if (link.kind === "pair" && link.ratio !== null && isFinite(link.ratio)) {
      return fill(t("link_title"), { old: old, new: current, pct: matchPercent(link) });
    }
    const word = { split: "badge_split", merge: "badge_merged" }[link.kind];
    return old + " → " + current + (word ? " · " + t(word) : "");
  }

  // The strip between the two maps of a comparison, ``column`` pixels to a column: a thin line
  // from each paragraph of the earlier version to the one it became, and a badge for each
  // paragraph that was added, removed, split or merged. The badge of a removed or split
  // paragraph (− and ÷) hangs under the earlier map, that of a new or merged one (+ and ∪) stands
  // over this one.
  function drawLinks(svg, column) {
    const L = LAYOUT;
    const width = L.LABEL_W + Math.max(before.items.length, now.items.length) * column;
    const centre = function (item) { return px(L.LABEL_W + column * (item.index + 0.5)); };
    clear(svg);
    setAttributes(svg, {
      width: px(width), height: L.LINKS_H, viewBox: "0 0 " + px(width) + " " + L.LINKS_H,
    });
    links.forEach(function (link) {
      const ends = {
        x1: centre(before.itemById.get(link.old)), y1: L.LINKS_Y.from,
        x2: centre(now.itemById.get(link.new)), y2: L.LINKS_Y.to,
      };
      // A line 1 px wide is hard to point at, so a wide invisible one lies over it for the hover.
      svg.appendChild(s("g", {
        class: "tm-link", "data-old": link.old, "data-new": link.new, "data-kind": link.kind,
      }, [
        s("title", null, linkTitle(link)),
        s("line", ends),
        s("line", Object.assign({ class: "tm-hit" }, ends)),
      ]));
    });
    const idsOf = function (entries, key) {
      return listOf(entries).filter(isObject).map(function (entry) { return entry[key]; });
    };
    [
      { kind: "added", ids: listOf(compare.added), model: now },
      { kind: "removed", ids: listOf(compare.removed), model: before },
      { kind: "split", ids: idsOf(compare.splits, "old"), model: before },
      { kind: "merged", ids: idsOf(compare.merges, "new"), model: now },
    ].forEach(function (badge) {
      const earlier = badge.model === before;
      badge.ids.map(asText).forEach(function (id) {
        if (!badge.model.itemById.has(id)) return;
        const called = earlier ? oldId(id) : shownId(id);
        svg.appendChild(s("text", {
          class: "tm-badge", "data-badge": badge.kind, "data-item": id,
          "data-side": earlier ? "before" : "now", x: centre(badge.model.itemById.get(id)),
          y: earlier ? L.LINKS_Y.before : L.LINKS_Y.now, "text-anchor": "middle",
          "dominant-baseline": "central",
        }, [
          s("title", null, called + " · " + t("badge_" + badge.kind)),
          BADGE_GLYPHS[badge.kind],
        ]));
      });
    });
  }

  // --- What is selected, and the detail box --------------------------------------------------

  const map = document.getElementById("tm-map");
  const beforeMap = document.getElementById("tm-map-before");   // shown with a comparison only
  const linksMap = document.getElementById("tm-links");         // the lines between the two maps
  const mapScroll = document.getElementById("tm-map-scroll");
  const detail = document.getElementById("tm-detail");
  const caseButtons = [];
  let pinned = null;                   // {type: "item", id} or {type: "case", index}, or null
  let preview = null;                  // the id of the item under the pointer on the map
  let isolated = null;                 // the id of the one lane left showing, or null
  let drawnRoom = -1;

  function shown() {
    if (preview !== null && now.itemById.has(preview)) return { type: "item", id: preview };
    return pinned;
  }
  function litItems() {
    const current = shown();
    if (!current) return new Set();
    if (current.type === "item") return new Set([current.id]);
    return new Set(cases[current.index] ? cases[current.index].at : []);
  }
  function isPinned(type, key) {
    return !!pinned && pinned.type === type && (type === "item" ? pinned.id : pinned.index) === key;
  }

  function applyState() {
    const lit = litItems();
    map.querySelectorAll(".tm-col").forEach(function (node) {
      node.classList.toggle("is-sel", lit.has(node.getAttribute("data-item")));
    });
    map.querySelectorAll(".tm-num").forEach(function (node) {
      const item = now.itemById.get(node.getAttribute("data-item"));
      node.classList.toggle("is-sel", lit.has(item.id));
      node.classList.toggle("is-faint", isolated !== null && !marks(item, isolated));
    });
    [map, beforeMap].forEach(function (svg) {
      svg.querySelectorAll(".tm-lane").forEach(function (node) {
        const other = isolated !== null && node.getAttribute("data-lane") !== isolated;
        node.classList.toggle("is-dim", other);
      });
    });
    // In a comparison, the columns of the earlier map that the lit items came from, and the lines
    // that end in them.
    const origins = new Set();
    lit.forEach(function (id) {
      (linksTo.get(id) || []).forEach(function (link) { origins.add(link.old); });
    });
    beforeMap.querySelectorAll(".tm-col").forEach(function (node) {
      node.classList.toggle("is-sel", origins.has(node.getAttribute("data-item")));
    });
    linksMap.querySelectorAll(".tm-link").forEach(function (node) {
      node.classList.toggle("is-sel", lit.has(node.getAttribute("data-new")));
    });
    map.querySelectorAll(".tm-lname").forEach(function (node) {
      node.setAttribute("aria-pressed", String(node.getAttribute("data-lane") === isolated));
    });
    roleButtons.forEach(function (button, id) {
      button.setAttribute("aria-pressed", String(isPinned("item", id)));
    });
    caseButtons.forEach(function (button, index) {
      button.setAttribute("aria-pressed", String(isPinned("case", index)));
    });
    renderDetail(shown());
  }

  function renderDetail(current) {
    clear(detail);
    detail.removeAttribute("data-item");
    detail.classList.toggle("is-empty", !current);
    if (!current) {
      append(detail, t("detail_hint"));
    } else if (current.type === "case") {
      const entry = cases[current.index];
      append(detail, [
        h("div", null, [h("strong", null, entry.name), " · " + joinIds(entry.at, shownId, " → ")]),
        entry.note ? h("div", { class: "tm-detail-note" }, entry.note) : null,
      ]);
    } else {
      renderItemDetail(now.itemById.get(current.id));
    }
  }

  // An item in the detail box: its id, role and label, the evidence, the threads it is on, the
  // quotes that the check could not find in it, and, in a comparison, where it came from.
  function renderItemDetail(item) {
    detail.setAttribute("data-item", item.id);
    const head = [roleName(item.role), item.label].filter(Boolean).join(" · ");
    const threads = h("div", { class: "tm-detail-threads" }, t("threads") + ": ");
    const marked = now.lanes.filter(function (lane) { return marks(item, lane.id); });
    if (!marked.length) append(threads, t("none"));
    marked.forEach(function (lane, position) {
      const mark = item.lanes[lane.id];
      if (position) append(threads, " · ");
      threads.appendChild(h("span", {
        class: "tm-thread", title: isObject(mark) ? quoted(mark.quote) : null,
      }, [dot(lane.hue), lane.name + " " + weightName(isObject(mark) ? mark.weight : "")]));
    });
    append(detail, [
      h("div", null, [h("strong", null, shownId(item.id)), head ? " · " + head : ""]),
      h("div", { class: "tm-quote", lang: quoteLanguage }, quoted(item.evidence)),
      threads,
    ]);
    if (badQuotes.has(item.id)) {
      const failed = badQuotes.get(item.id).map(function (problem) {
        const where = problem.lane === null ? "" : laneName(problem.lane) + " ";
        return where + quoted(problem.quote);
      });
      const note = t("warn_quote") + ": " + failed.join(" · ");
      detail.appendChild(h("div", { class: "tm-warn-note" }, note));
    }
    const origin = originText(item);
    if (origin) detail.appendChild(h("div", { class: "tm-detail-before" }, origin));
  }

  function select(id) {
    const key = id === null || id === undefined ? null : String(id);
    pinned = key !== null && now.itemById.has(key) ? { type: "item", id: key } : null;
    preview = null;
    applyState();
  }
  function isolateLane(id) {
    const key = id === null || id === undefined ? null : String(id);
    isolated = key !== null && now.laneById.has(key) ? key : null;
    applyState();
  }

  // Bring a column into view: across, inside the map's scroll box, and down to the map when the
  // map is off the screen.
  function reveal(id) {
    const column = Array.prototype.find.call(map.querySelectorAll(".tm-col"), function (node) {
      return node.getAttribute("data-item") === id;
    });
    if (!column) return;
    const box = mapScroll.getBoundingClientRect();
    const place = column.getBoundingClientRect();
    if (place.left < box.left || place.right > box.right) {
      mapScroll.scrollLeft += place.left - box.left - (box.width - place.width) / 2;
    }
    if (box.bottom < 0 || box.top > window.innerHeight) {
      const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      document.getElementById("tm-map-panel").scrollIntoView({
        behavior: still ? "auto" : "smooth", block: "center",
      });
    }
  }

  function pressRole(id) {
    if (isPinned("item", id)) {
      select(null);
      return;
    }
    select(id);
    reveal(id);
  }
  function pressCase(index) {
    if (isPinned("case", index)) {
      pinned = null;
    } else {
      pinned = { type: "case", index: index };
      isolated = null;
    }
    preview = null;
    applyState();
  }
  function pressLane(id) {
    isolateLane(isolated === id ? null : id);
  }

  // With a comparison, the earlier map, the strip of lines and the heads and legend that go with
  // them show too. An svg element has no hidden property, so its attribute is taken off.
  function showComparisonMap() {
    const heads = { before: columnHead("before_col", compare.against),
                    now: columnHead("now_col", data.version) };
    setText("tm-compare-legend", t("compare_legend"));
    setText("tm-map-before-head", heads.before);
    setText("tm-map-now-head", heads.now);
    ["tm-compare-legend", "tm-map-before-head", "tm-map-now-head"].forEach(function (id) {
      document.getElementById(id).hidden = false;
    });
    beforeMap.removeAttribute("hidden");
    linksMap.removeAttribute("hidden");
    beforeMap.setAttribute("aria-label", t("map") + " · " + heads.before);
    map.setAttribute("aria-label", t("map") + " · " + heads.now);
    // A click on a column of the earlier map selects the paragraph it became, the first of them
    // for one that was split. One that was removed becomes nothing, and so selects nothing.
    beforeMap.addEventListener("click", function (event) {
      const target = event.target.closest("[data-item]");
      if (!target) return;
      const own = linksFrom.get(target.getAttribute("data-item"));
      select(own ? own[0].new : null);
    });
  }

  function renderMapPanel() {
    setText("tm-map-title", t("map"));
    setText("tm-map-legend", t("map_legend"));
    map.setAttribute("aria-label", t("map"));
    if (compare) showComparisonMap();
    map.addEventListener("mouseover", function (event) {
      const target = event.target.closest("[data-item]");
      if (!target || preview === target.getAttribute("data-item")) return;
      preview = target.getAttribute("data-item");
      applyState();
    });
    map.addEventListener("mouseleave", function () {
      if (!pinned || preview === null) return;   // with nothing pinned, the last one stays shown
      preview = null;
      applyState();
    });
    map.addEventListener("click", function (event) {
      const name = event.target.closest(".tm-lname");
      const target = event.target.closest("[data-item]");
      if (name) pressLane(name.getAttribute("data-lane"));
      else if (target) select(target.getAttribute("data-item"));
    });
    map.addEventListener("keydown", function (event) {
      const name = event.target.closest(".tm-lname");
      if (name && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        pressLane(name.getAttribute("data-lane"));
      }
    });
  }

  function redrawMap() {
    if (!mapScroll.isConnected) return;  // the poster shows in place of the page
    const room = Math.min(mapScroll.clientWidth, LAYOUT.CONTENT_MAX);
    if (room === drawnRoom) return;
    drawnRoom = room;
    if (before) {
      // Both maps and the strip between them take the columns of the longer map, so that their
      // columns line up and they scroll together.
      const slots = Math.max(before.items.length, now.items.length);
      const column = drawMap(map, room, now, slots);
      drawMap(beforeMap, room, before, slots);
      drawLinks(linksMap, column);
      [[map, now], [beforeMap, before]].forEach(function (pair) {   // for the print style sheet
        const share = (LAYOUT.LABEL_W + pair[1].items.length * column)
          / (LAYOUT.LABEL_W + slots * column);
        pair[0].style.setProperty("--share", String(Math.round(share * 1000) / 1000));
      });
    } else {
      drawMap(map, room);
    }
    applyState();
  }

  // --- The list of all paragraphs -----------------------------------------------------------
