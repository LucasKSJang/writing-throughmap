  function renderList() {
    const extra = now.items.filter(function (item) { return item.kind !== "paragraph"; })
      .map(function (item) { return shownId(item.id); });
    const count = extra.length
      ? counted("list_count_and", now.paragraphCount, { extra: extra.join(", ") })
      : counted("list_count", now.paragraphCount);
    setText("tm-list-summary", t("list_toggle") + " · " + count);
    const rows = document.getElementById("tm-rows");
    now.items.forEach(function (item) { rows.appendChild(listRow(item)); });
  }

  // A row of the list: id, role, label, the evidence, and each thread mark with its quote. A
  // quote that the check could not find is marked where it stands, in words, so that the list
  // (and a printout) says what the badge on the role means.
  function listRow(item) {
    const bad = badQuotes.get(item.id) || [];
    const failed = function (laneId) {
      return bad.some(function (problem) { return problem.lane === laneId; });
    };
    const quote = function (text, laneId) {
      return [
        h("span", { class: "tm-quote", lang: quoteLanguage }, quoted(text)),
        failed(laneId) ? h("span", { class: "tm-bad-note" }, t("warn_quote")) : null,
      ];
    };
    const unbadged = bad.length && !roleButtons.has(item.id);   // an item that no card shows
    const row = h("div", { class: "tm-row", "data-item": item.id }, [
      h("span", { class: "tm-row-id" }, shownId(item.id)),
      h("span", { class: "tm-row-role" }, h("span", { class: "tm-chip" }, roleName(item.role))),
      h("span", { class: "tm-row-label" }, [item.label, unbadged ? warnBadge(item.id) : null]),
      h("div", { class: failed(null) ? "tm-row-quote is-bad" : "tm-row-quote" },
        quote(item.evidence, null)),
    ]);
    now.lanes.forEach(function (lane) {
      if (!marks(item, lane.id)) return;
      const mark = isObject(item.lanes[lane.id]) ? item.lanes[lane.id] : {};
      row.appendChild(h("div", { class: failed(lane.id) ? "tm-row-mark is-bad" : "tm-row-mark" }, [
        dot(lane.hue),
        h("span", null, lane.name + " · " + weightName(mark.weight) + " ·"),
      ].concat(quote(mark.quote, lane.id))));
    });
    return row;
  }

  // --- Recurring examples -------------------------------------------------------------------

  function renderCases() {
    document.getElementById("tm-cases").hidden = !cases.length;
    setText("tm-cases-title", t("cases"));
    setText("tm-cases-hint", t("cases_hint"));
    const list = document.getElementById("tm-cases-list");
    cases.forEach(function (entry, index) {
      const button = h("button", {
        class: "tm-case", type: "button", "data-items": entry.at.join(" "),
        title: entry.note || null, "aria-pressed": "false",
      }, [
        h("span", { class: "tm-case-name" }, entry.name),
        " · " + joinIds(entry.at, shownId, " → "),
      ]);
      button.addEventListener("click", function () { pressCase(index); });
      caseButtons.push(button);
      list.appendChild(button);
    });
  }

  // --- Gaps ---------------------------------------------------------------------------------

  function observationText(observation) {
    if (!isObject(observation)) return "";
    if (observation.type === "quiet") {
      return fill(t("obs_quiet"), {
        lane: laneName(observation.lane), n: formatNumber(observation.length),
        from: shownId(observation.from), to: shownId(observation.to),
      });
    }
    if (observation.type === "unresolved") {
      return fill(t("obs_unresolved"), { lane: laneName(observation.lane) });
    }
    if (observation.type === "unthreaded") {
      const at = Array.isArray(observation.at) ? observation.at : [observation.at];
      return fill(t("obs_unthreaded"), { at: joinIds(at, shownId, ", ") });
    }
    return "";
  }

  function renderGaps() {
    const notes = observations.map(observationText).filter(Boolean);
    const total = gaps.length + notes.length;
    append(document.getElementById("tm-gaps-summary"), [
      t("gaps") + " " + counted("n_items", total),
      h("span", { class: "tm-toggle-hint" }, " · " + t("gaps_toggle")),
    ]);
    const body = document.getElementById("tm-gaps-body");
    gaps.forEach(function (gap) {
      const direction = gap.direction ? t("direction") + ": " + gap.direction : "";
      body.appendChild(h("div", { class: "tm-gap" }, [
        gap.note, direction ? h("div", { class: "tm-direction" }, direction) : null,
      ]));
    });
    if (notes.length) {
      body.appendChild(h("h3", { class: "tm-subhead" }, t("computed")));
      notes.forEach(function (note) { body.appendChild(h("div", { class: "tm-obs" }, note)); });
    }
    if (!total) body.appendChild(h("p", { class: "tm-none" }, t("none")));
  }

  // --- Footer -------------------------------------------------------------------------------

  // The name of the draft's file without its folder and its extension, as Python's
  // os.path.splitext takes the extension off: "notes.v2.docx" gives "notes.v2", ".md" stays.
  function sourceStem() {
    const name = asText(essay.source).replace(/^.*[\\/]/, "");
    const dot = name.lastIndexOf(".");
    const start = name.search(/[^.]/);       // leading dots belong to the name
    return start >= 0 && dot > start ? name.slice(0, dot) : name;
  }

  // Where the data file of this version is: the page's own folder when it is a .throughmap
  // folder, else the folder that build makes for the draft.
  function dataFile() {
    let folder = "";
    try {
      const parts = decodeURIComponent(window.location.pathname).split("/");
      folder = parts.length > 1 ? parts[parts.length - 2] : "";
    } catch (error) {
      folder = "";
    }
    if (!/\.throughmap$/.test(folder)) folder = (sourceStem() || "essay") + ".throughmap";
    return folder + "/v" + data.version + ".json";
  }

  function renderFooter() {
    const parts = [t("footer_offline")];
    if (hasVersion) parts.push(t("data_file") + ": " + dataFile());
    setText("tm-footer", parts.join(" · "));
  }

  // --- The poster ---------------------------------------------------------------------------
  // A picture of the page to share: the header, the section cards, the thread map and the
  // recurring examples, then a footer line, in one svg 1,200 px wide. It keeps its own light
  // palette and the system fonts whatever the page's colour scheme, and it is shapes and text
  // only, with no HTML inside, so that a canvas it is painted on can still be saved. posterSVG()
  // gives it as standalone markup, exportPNG() saves it as a PNG twice its size, and #poster
  // shows it alone.

  const POSTER = Object.freeze({
    WIDTH: 1200,
    PAD: 48,                           // on every side, so the content is 1,104 px wide
    SCALE: 2,                          // pixels of the PNG per pixel of the poster
    FONT: '-apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif',
    BG: "#ffffff",
    TEXT: "#1f1f1e",
    TEXT_2: "#5f5e5a",
    BORDER: "#d3d1c7",
    CARD: "#f7f6f2",
  });
  const POSTER_CONTENT = POSTER.WIDTH - 2 * POSTER.PAD;
  const CARD = Object.freeze({ PAD_X: 16, PAD_Y: 12, CHIP_H: 22, ROW: 30 });

  // The poster's text styles: size and line height in px, weight, and colour (secondary if none).
  const POSTER_TEXT = Object.freeze({
    "tm-p-title": { size: 28, line: 36, weight: 600, fill: POSTER.TEXT },
    "tm-p-meta": { size: 13, line: 20 },
    "tm-p-label": { size: 12, line: 18 },
    "tm-p-thesis": { size: 15, line: 23, fill: POSTER.TEXT },
    "tm-p-qid": { size: 14, line: 22, weight: 600, fill: POSTER.TEXT },
    "tm-p-question": { size: 14, line: 22, fill: POSTER.TEXT },
    "tm-p-note": { size: 12.5, line: 22 },
    "tm-p-heading": { size: 16, line: 22, weight: 600, fill: POSTER.TEXT },
    "tm-p-legend": { size: 12.5, line: 18 },
    "tm-p-short": { size: 13, line: 20, weight: 600, fill: POSTER.TEXT },
    "tm-p-sechead": { size: 13, line: 20 },
    "tm-p-tag": { size: 11.5, line: 20 },
    "tm-p-concl": { size: 14, line: 22, fill: POSTER.TEXT },
    "tm-p-chip": { size: 12, line: 22, fill: POSTER.TEXT },
    "tm-p-arrow": { size: 12, line: 22 },
    "tm-p-warn": { size: 11, line: 16, weight: 600, fill: POSTER.BG },
    "tm-p-baton": { size: 13, line: 20 },
    "tm-p-casename": { size: 13, line: 20, weight: 600, fill: POSTER.TEXT },
    "tm-p-case": { size: 13, line: 20, fill: POSTER.TEXT },
    "tm-p-footer": { size: 12, line: 18 },
  });

  // The poster's style sheet, which travels inside its svg: the map's classes as the page draws
  // them, in the light palette, then the poster's own text. Every rule starts with #tm-poster, so
  // that on the page it styles the poster and nothing else.
  const POSTER_STYLE = [
    "#tm-poster text { font-family: " + POSTER.FONT + "; font-size: 11px; fill: " + POSTER.TEXT_2
      + "; }",
    "#tm-poster .tm-bandbg { fill: " + POSTER.CARD + "; }",
    "#tm-poster .tm-bandbg.is-odd, #tm-poster .tm-col, #tm-poster .tm-lname-bg { fill: none; }",
    "#tm-poster .tm-sep { stroke: " + POSTER.BORDER + "; stroke-width: 1; }",
    "#tm-poster .tm-lname-name, #tm-poster .tm-lname-desc { font-size: 12px; }",
    "#tm-poster .tm-lname-name { font-weight: 600; fill: " + POSTER.TEXT + "; }",
    "#tm-poster .tm-span { stroke-width: 1; stroke-dasharray: 2 4; }",
    "#tm-poster .tm-run { stroke-width: 2.5; stroke-opacity: 0.5; stroke-linecap: round; }",
  ].concat(Object.keys(POSTER_TEXT).map(function (name) {
    const style = POSTER_TEXT[name];
    return "#tm-poster ." + name + " { font-size: " + style.size + "px;"
      + (style.weight ? " font-weight: " + style.weight + ";" : "")
      + (style.fill ? " fill: " + style.fill + ";" : "") + " }";
  })).join("\n");

  // Split ``text`` into lines at most ``room`` px wide in the style ``className``. Lines break at
  // spaces, and inside a word only when the word alone is wider than a line. The first line has
  // ``first`` px when something stands before it, and is "" when not even a word fits there.
  function wrapText(text, className, room, first) {
    const words = asText(text).split(/\s+/).filter(Boolean);
    const lines = [];
    let space = first === undefined ? room : first;
    let line = "";
    const fits = function (candidate) { return measure(candidate, className) <= space; };
    const close = function () {
      lines.push(line);
      line = "";
      space = room;
    };
    words.forEach(function (word) {
      const longer = line ? line + " " + word : word;
      if (fits(longer)) {
        line = longer;
        return;
      }
      if (line || space < room) {
        close();
        if (fits(word)) {
          line = word;
          return;
        }
      }
      Array.from(word).forEach(function (char) {
        if (line && !fits(line + char)) close();
        line += char;
      });
    });
    if (line) lines.push(line);
    return lines;
  }

  // Lay out runs of text, {text, className}, one after another in lines ``room`` px wide: each
  // run goes on ``gap`` px after the one before and wraps as wrapText does. Returns the pieces to
  // draw, {text, className, x, line}, the number of lines, where the last line ends and the
  // width of the widest.
  function layoutRuns(runs, room, gap) {
    const pieces = [];
    let line = 0;
    let end = 0;
    let widest = 0;
    runs.forEach(function (run) {
      if (!asText(run.text)) return;
      const start = end ? end + gap : 0;
      wrapText(run.text, run.className, room, room - start).forEach(function (text, number) {
        if (number) line += 1;
        if (!text) return;             // nothing fitted after what was there: on to the next line
        const x = number ? 0 : start;
        pieces.push({ text: text, className: run.className, x: x, line: line });
        end = x + measure(text, run.className);
        widest = Math.max(widest, end);
      });
    });
    return { pieces: pieces, lines: pieces.length ? line + 1 : 0, end: end, width: widest };
  }

  function posterText(text, className, x, y, anchor) {
    return s("text", {
      class: className, x: px(x), y: px(y), "text-anchor": anchor || null,
      "dominant-baseline": "central",
    }, text);
  }
  // Draw laid-out runs from (left, top), ``lineHeight`` px a line; return the height they take.
  function drawPieces(parent, layout, left, top, lineHeight) {
    layout.pieces.forEach(function (piece) {
      parent.appendChild(posterText(piece.text, piece.className, left + piece.x,
                                    top + lineHeight * (piece.line + 0.5)));
    });
    return layout.lines * lineHeight;
  }
  // Draw ``text`` in one style, wrapped to ``room`` px; return the height it takes.
  function drawText(parent, text, className, left, top, room) {
    const layout = layoutRuns([{ text: text, className: className }], room, 0);
    return drawPieces(parent, layout, left, top, POSTER_TEXT[className].line);
  }

  // Place boxes of the given widths in rows ``room`` px wide, ``gap`` px apart. Returns where
  // each one goes, {x, row}, and the number of rows.
  function flowBoxes(widths, room, gap) {
    const places = [];
    let row = 0;
    let x = 0;
    widths.forEach(function (width) {
      if (x && x + width > room) {
        row += 1;
        x = 0;
      }
      places.push({ x: x, row: row });
      x += width + gap;
    });
    return { places: places, rows: places.length ? row + 1 : 0 };
  }

  // A box with a 1 px border inside its bounds.
  function posterBox(x, y, width, height, fill, radius) {
    return s("rect", {
      x: px(x + 0.5), y: px(y + 0.5), width: px(width - 1), height: px(height - 1),
      rx: radius, fill: fill, stroke: POSTER.BORDER,
    });
  }
  function posterRule(svg, y) {
    svg.appendChild(s("line", {
      class: "tm-p-rule", x1: POSTER.PAD, y1: px(y + 0.5), x2: POSTER.PAD + POSTER_CONTENT,
      y2: px(y + 0.5), stroke: POSTER.BORDER,
    }));
  }
  // A rule across the poster, then a panel's heading; returns where the panel goes on.
  function posterPanel(svg, top, title) {
    posterRule(svg, top + 24);
    return top + 40 + drawText(svg, title, "tm-p-heading", POSTER.PAD, top + 40, POSTER_CONTENT)
      + 8;
  }

  // The title, the meta line, the thesis with its bar, and the questions.
  function posterHeader(svg, top) {
    const left = POSTER.PAD;
    let y = top + drawText(svg, essay.title, "tm-p-title", left, top, POSTER_CONTENT);
    y += 4 + drawText(svg, metaText(), "tm-p-meta", left, y + 4, POSTER_CONTENT);
    const thesis = asText(data.thesis);
    if (thesis) {
      const start = y + 16;
      y = start + 8 + drawText(svg, t("thesis"), "tm-p-label", left + 14, start + 8,
                               POSTER_CONTENT - 14);
      y += drawText(svg, thesis, "tm-p-thesis", left + 14, y, POSTER_CONTENT - 14) + 8;
      svg.appendChild(s("rect", {
        x: left, y: px(start), width: 2, height: px(y - start), fill: POSTER.BORDER,
      }));
    }
    if (now.questions.length) {
      y += 12 + drawText(svg, t("questions"), "tm-p-label", left, y + 12, POSTER_CONTENT) + 2;
      now.questions.forEach(function (question) { y += posterQuestion(svg, question, left, y) + 2; });
    }
    return y;
  }

  // A question: its dot, its id in bold, then its text and the note on the threads that judge
  // it, wrapping under the start of the text.
  function posterQuestion(svg, question, left, top) {
    const line = POSTER_TEXT["tm-p-question"].line;
    const textLeft = left + 14 + measure(question.id, "tm-p-qid") + 6;
    svg.appendChild(s("circle", {
      class: "tm-p-dot", cx: left + 4, cy: px(top + line / 2), r: 4,
      fill: questionHue(question.id, now),
    }));
    svg.appendChild(posterText(question.id, "tm-p-qid", left + 14, top + line / 2));
    const layout = layoutRuns([
      { text: question.text, className: "tm-p-question" },
      { text: judgedBy(question), className: "tm-p-note" },
    ], left + POSTER_CONTENT - textLeft, 6);
    return Math.max(drawPieces(svg, layout, textLeft, top, line), line);
  }

  // The section cards, joined by their batons.
  function posterFlow(svg, top) {
    if (!now.sections.length) return top;
    let y = posterPanel(svg, top, t("flow"));
    now.sections.forEach(function (section, number) {
      y = posterCard(svg, section, y);
      if (number === now.sections.length - 1) return;
      if (section.baton) {
        y += 5 + drawText(svg, "↓ " + section.baton, "tm-p-baton", POSTER.PAD + 18, y + 5,
                          POSTER_CONTENT - 18) + 5;
      } else {
        y += 8;
      }
    });
    return y;
  }

  // A section's card: the short name, heading and range (and the inferred tag), the conclusion
  // and the role sequence on the left, the questions it answers at the top right. Returns where
  // the card ends.
  function posterCard(svg, section, top) {
    const card = s("g", { class: "tm-p-card", "data-section": section.id });
    svg.appendChild(card);
    const box = s("rect", {
      class: "tm-p-cardbg", x: px(POSTER.PAD + 0.5), y: px(top + 0.5), width: POSTER_CONTENT - 1,
      rx: 8, fill: POSTER.CARD, stroke: POSTER.BORDER,
    });
    card.appendChild(box);
    const left = POSTER.PAD + CARD.PAD_X;
    const inner = POSTER_CONTENT - 2 * CARD.PAD_X;
    const answers = section.answers.map(function (id) {
      return { id: id, width: 29 + measure(id, "tm-p-chip") };      // padding, dot, gap
    });
    const answersWidth = answers.reduce(function (sum, chip) { return sum + chip.width + 6; }, 0)
      - (answers.length ? 6 : 0);
    const room = answers.length ? inner - answersWidth - 12 : inner;
    const headLine = POSTER_TEXT["tm-p-sechead"].line;
    let y = top + CARD.PAD_Y;

    const rest = [section.title !== section.short ? section.title : "", rangeOf(section, now)]
      .filter(Boolean).join(" · ");
    const head = layoutRuns([
      { text: section.short || section.id, className: "tm-p-short" },
      { text: rest ? "· " + rest : "", className: "tm-p-sechead" },
    ], room, 4);
    drawPieces(card, head, left, y, headLine);
    let headLines = Math.max(head.lines, 1);
    if (section.inferred) {
      const label = t("inferred");
      const width = measure(label, "tm-p-tag") + 12;
      let x = head.end + 6;
      if (x + width > room) {
        x = 0;
        headLines += 1;
      }
      const middle = y + headLine * (headLines - 0.5);
      card.appendChild(s("rect", {
        x: px(left + x + 0.5), y: px(middle - 8.5), width: px(width - 1), height: 17, rx: 4,
        fill: "none", stroke: POSTER.BORDER, "stroke-dasharray": "3 2",
      }));
      card.appendChild(posterText(label, "tm-p-tag", left + x + 6, middle));
    }
    y += headLines * headLine;
    if (section.conclusion) {
      y += 2 + drawText(card, section.conclusion, "tm-p-concl", left, y + 2, room);
    }
    const sequence = posterSequence(card, section, left, y + 8, room);
    if (sequence) y += 8 + sequence;
    y += CARD.PAD_Y;
    box.setAttribute("height", px(y - top - 1));

    let x = left + inner - answersWidth;
    answers.forEach(function (chip) {
      const chipTop = top + CARD.PAD_Y + headLine / 2 - CARD.CHIP_H / 2;
      const middle = chipTop + CARD.CHIP_H / 2;
      card.appendChild(s("g", { class: "tm-p-answer" }, [
        posterBox(x, chipTop, chip.width, CARD.CHIP_H, "none", 5),
        s("circle", { cx: px(x + 12), cy: px(middle), r: 4, fill: questionHue(chip.id, now) }),
        posterText(chip.id, "tm-p-chip", x + 21, middle),
      ]));
      x += chip.width + 6;
    });
    return y;
  }

  // A section's items as chips with their roles, "P1 Problem → P2 Claim", in rows that wrap;
  // a chip that would not fit even a row of its own is cut short. Returns the height they take.
  function posterSequence(card, section, left, top, room) {
    const sectionItems = itemsOf(now, section);
    const arrow = measure("→", "tm-p-arrow");
    const steps = sectionItems.map(function (item, position) {
      const last = position === sectionItems.length - 1;
      const warned = badQuotes.has(item.id);
      const extra = (warned ? 20 : 0) + (last ? 0 : 4 + arrow);
      const label = fitText(shownId(item.id) + " " + roleName(item.role), room - extra - 14,
                            "tm-p-chip").text;
      const chip = measure(label, "tm-p-chip") + 14;
      return { item: item, label: label, chip: chip, warned: warned, last: last,
               width: chip + extra };
    });
    const flow = flowBoxes(steps.map(function (step) { return step.width; }), room, 6);
    steps.forEach(function (step, number) {
      const x = left + flow.places[number].x;
      const y = top + flow.places[number].row * CARD.ROW;
      const middle = y + CARD.CHIP_H / 2;
      const group = s("g", { class: "tm-p-role", "data-item": step.item.id }, [
        posterBox(x, y, step.chip, CARD.CHIP_H, POSTER.BG, 5),
        posterText(step.label, "tm-p-chip", x + 7, middle),
      ]);
      let end = x + step.chip;
      if (step.warned) {               // a quote of this item is not in its text
        group.appendChild(s("circle", { cx: px(end + 12), cy: px(middle), r: 8,
                                        fill: POSTER.TEXT }));
        group.appendChild(posterText("!", "tm-p-warn", end + 12, middle, "middle"));
        end += 20;
      }
      if (!step.last) group.appendChild(posterText("→", "tm-p-arrow", end + 4, middle));
      card.appendChild(group);
    });
    return flow.rows ? (flow.rows - 1) * CARD.ROW + CARD.CHIP_H : 0;
  }

  // The thread map with its legend, drawn by the page's own drawMap at the poster's width.
  function posterMap(svg, top) {
    let y = posterPanel(svg, top, t("map"));
    y += drawText(svg, t("poster_legend"), "tm-p-legend", POSTER.PAD, y, POSTER_CONTENT) + 10;
    const map = s("svg", { class: "tm-p-map", x: POSTER.PAD, y: px(y) });
    svg.appendChild(map);
    drawMap(map, POSTER_CONTENT);
    const width = Number(map.getAttribute("width"));
    let height = Number(map.getAttribute("height"));
    if (width > POSTER_CONTENT) {      // more columns than 14 px each allow: the map shrinks
      height = height * POSTER_CONTENT / width;
      setAttributes(map, { width: POSTER_CONTENT, height: px(height) });
    }
    map.querySelectorAll(".tm-lname").forEach(function (name) {    // no buttons on a poster
      ["role", "tabindex", "aria-pressed"].forEach(function (key) { name.removeAttribute(key); });
    });
    return y + height;
  }

  // One chip per recurring example, its name in bold and where it appears, in rows that wrap.
  function posterCases(svg, top) {
    if (!cases.length) return top;
    const y = posterPanel(svg, top, t("cases"));
    const padX = 10;
    const padY = 4;
    const line = POSTER_TEXT["tm-p-case"].line;
    const chips = cases.map(function (entry) {
      const places = joinIds(entry.at, shownId, " → ");
      const layout = layoutRuns([
        { text: entry.name, className: "tm-p-casename" },
        { text: places ? "· " + places : "", className: "tm-p-case" },
      ], POSTER_CONTENT - 2 * padX, 4);
      return { layout: layout, width: layout.width + 2 * padX,
               height: Math.max(layout.lines, 1) * line + 2 * padY };
    });
    const flow = flowBoxes(chips.map(function (chip) { return chip.width; }), POSTER_CONTENT, 8);
    const rowHeights = [];
    flow.places.forEach(function (place, number) {
      rowHeights[place.row] = Math.max(rowHeights[place.row] || 0, chips[number].height);
    });
    const rowTops = [];
    let rowTop = y;
    rowHeights.forEach(function (height, row) {
      rowTops[row] = rowTop;
      rowTop += height + 8;
    });
    chips.forEach(function (chip, number) {
      const x = POSTER.PAD + flow.places[number].x;
      const chipTop = rowTops[flow.places[number].row];
      const group = s("g", { class: "tm-p-case" },
                      posterBox(x, chipTop, chip.width, chip.height, POSTER.BG, 6));
      drawPieces(group, chip.layout, x + padX, chipTop + padY, line);
      svg.appendChild(group);
    });
    return rowTop - 8;
  }

  // A rule, then the name of the tool and, for a built page, the data file of this version.
  function posterFooter(svg, top) {
    posterRule(svg, top + 24);
    const parts = ["throughmap"];
    if (hasVersion) parts.push(t("data_file") + ": " + dataFile());
    return top + 36 + drawText(svg, parts.join(" · "), "tm-p-footer", POSTER.PAD, top + 36,
                               POSTER_CONTENT);
  }

  // Draw a new poster and return its svg element, out of the document. It is drawn in a hidden
  // box on the page, since text can only be measured there, and its height follows its content.
  function buildPoster() {
    const host = h("div", { class: "tm-measure", "aria-hidden": "true" });
    const poster = s("svg", { id: "tm-poster", width: POSTER.WIDTH, role: "img" }, [
      s("title", null, asText(essay.title) || "throughmap"),
      s("style", null, POSTER_STYLE),
    ]);
    const background = s("rect", {
      class: "tm-p-bg", x: 0, y: 0, width: POSTER.WIDTH, fill: POSTER.BG,
    });
    poster.appendChild(background);
    host.appendChild(poster);
    document.body.appendChild(host);
    posterProbe = poster.appendChild(s("text", { x: 0, y: 0 }));
    try {
      let y = posterHeader(poster, POSTER.PAD);
      y = posterFlow(poster, y);
      y = posterMap(poster, y);
      y = posterCases(poster, y);
      y = posterFooter(poster, y);
      const height = Math.ceil(y + POSTER.PAD);
      setAttributes(poster, { height: height, viewBox: "0 0 " + POSTER.WIDTH + " " + height });
      background.setAttribute("height", height);
    } finally {
      posterProbe.remove();
      posterProbe = null;
      host.remove();
    }
    poster.remove();
    return poster;
  }

  // XML 1.0 allows these characters only. Any other (most control characters, and a surrogate
  // that is not part of a pair) is left out of the markup, which could not be read with it.
  function allowedInXML(code) {
    return code === 0x9 || code === 0xA || code === 0xD || (code >= 0x20 && code <= 0xD7FF)
      || (code >= 0xE000 && code <= 0xFFFD) || code >= 0x10000;
  }
  function escapeXML(value) {
    return Array.from(String(value))
      .filter(function (char) { return allowedInXML(char.codePointAt(0)); }).join("")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  // An svg element as standalone XML markup, with every text and attribute value escaped.
  function toMarkup(node, root) {
    if (node.nodeType === Node.TEXT_NODE) return escapeXML(node.nodeValue);
    if (node.nodeType !== Node.ELEMENT_NODE) return "";
    let markup = "<" + node.localName + (root ? ' xmlns="' + SVG_NS + '"' : "");
    Array.prototype.forEach.call(node.attributes, function (attribute) {
      markup += " " + attribute.name + '="' + escapeXML(attribute.value) + '"';
    });
    const inside = Array.prototype.map.call(node.childNodes, function (child) {
      return toMarkup(child, false);
    }).join("");
    return markup + (inside ? ">" + inside + "</" + node.localName + ">" : "/>");
  }

  function posterSVG() {
    return toMarkup(buildPoster(), true);
  }

  // tm_text.slugify: lowercase, each run of anything but letters and digits becomes "-", no "-"
  // at either end, at most 60 characters; "essay" when nothing is left.
  function slugify(text) {
    const trim = function (value) { return value.replace(/^-+|-+$/g, ""); };
    const slug = trim(asText(text).toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "-"));
    return trim(Array.from(slug).slice(0, 60).join("")) || "essay";
  }
  // <stem>-throughmap.png: the draft's file name without its extension, else the title's slug.
  function pngName() {
    return (sourceStem().trim() || slugify(essay.title)) + "-throughmap.png";
  }

  function loadImage(url) {
    return new Promise(function (resolve, reject) {
      const image = new Image();
      image.onload = function () { resolve(image); };
      image.onerror = function () { reject(new Error("The browser could not draw the poster.")); };
      image.src = url;
    });
  }
  function canvasPNG(canvas) {
    return new Promise(function (resolve, reject) {
      canvas.toBlob(function (png) {
        if (png) resolve(png);
        else reject(new Error("The browser could not make a PNG of " + canvas.width + " by "
                              + canvas.height + " pixels."));
      }, "image/png");
    });
  }
  // Hand ``blob`` to the browser to save as ``name``.
  function download(blob, name) {
    const url = URL.createObjectURL(blob);
    const link = h("a", { href: url, download: name, hidden: true });
    document.body.appendChild(link);
    link.click();
    link.remove();
    window.setTimeout(function () { URL.revokeObjectURL(url); }, 60000);   // once it is saved
  }

  // Paint the poster on a canvas at twice its size and save it as <stem>-throughmap.png. The
  // poster goes in as an image from a blob URL, revoked once it is drawn: nothing comes from
  // the network.
  function exportPNG() {
    return Promise.resolve().then(function () {
      const poster = buildPoster();
      const width = Number(poster.getAttribute("width"));
      const height = Number(poster.getAttribute("height"));
      const markup = new Blob([toMarkup(poster, true)], { type: "image/svg+xml" });
      const source = URL.createObjectURL(markup);
      return loadImage(source).then(function (image) {
        const canvas = h("canvas", { width: width * POSTER.SCALE, height: height * POSTER.SCALE });
        const context = canvas.getContext("2d");
        context.fillStyle = POSTER.BG;

  // #poster shows the poster alone, on white, in place of the page; leaving it brings the page

  const pageMain = document.querySelector("main");
  let posterShown = null;

  function showPoster(wanted) {
    if (wanted === (posterShown !== null)) return;

      posterShown = buildPoster();

    } else {
      posterShown.replaceWith(pageMain);

    document.documentElement.classList.toggle("tm-poster-mode", wanted);
    if (!wanted) redrawMap();
  }

  // --- Deep links, keys, resizing and printing ----------------------------------------------

  // #select=<id> pins an item and #lane=<id> isolates a lane; both may come, joined by "&".
  // #poster shows the poster instead of the page.
  function readHash() {
    const found = {};
    window.location.hash.replace(/^#/, "").split("&").forEach(function (part) {
      if (!part) return;
      const equals = part.indexOf("=");
      try {
        const key = decodeURIComponent(equals < 0 ? part : part.slice(0, equals));
        found[key] = equals < 0 ? "" : decodeURIComponent(part.slice(equals + 1));
      } catch (error) {
        // a malformed escape: the part is ignored
      }
    });
    return found;
  }
  function applyHash() {
    const found = readHash();
    showPoster(has(found, "poster"));
    isolated = has(found, "lane") && now.laneById.has(found.lane) ? found.lane : null;
    const selected = has(found, "select") && now.itemById.has(found.select);
    pinned = selected ? { type: "item", id: found.select } : null;
    preview = null;

  }

  let resizeTimer = 0;
  let openBeforePrint = null;

  function listen() {
    window.addEventListener("hashchange", applyHash);

      openBeforePrint = null;
    });
    document.getElementById("tm-print").addEventListener("click", function () { window.print(); });
    const pngButton = document.getElementById("tm-png");
    pngButton.addEventListener("click", function () {
      if (typeof api.exportPNG !== "function") return;
      setText("tm-note", "");
      pngButton.disabled = true;       // one export at a time
      Promise.resolve().then(function () { return api.exportPNG(); }).catch(function (error) {

  const api = {

  window.throughmap = api;

  renderHeader();
  renderChanges();
  renderFlow();
  renderMapPanel();
  renderList();
  renderCases();
  renderGaps();
  renderFooter();
  listen();
  redrawMap();                         // last, once the page is as tall as it gets
  applyHash();

e numerous advantages promised by a wellconstructed Union, none deserves to be more accurately developed than its tendency to break and control the violence of faction. The friend of popular governments never finds himself so much alarmed for their character and fate, as when he contemplates their propensity to this dangerous vice. He will not fail, therefore, to set a due value on any plan which, without violating the principles to which he is attached, provides a proper cure for it. The instability, injustice, and confusion introduced into the public councils, have, in truth, been the mortal diseases under which popular governments have everywhere perished; as they continue to be the favorite and fruitful topics from which the adversaries to liberty derive their most specious declamations. The valuable improvements made by the American constitutions on the popular models, both ancient and modern, cannot certainly be too much admired; but it would be an unwarrantable partiality, to contend that they have as effectually obviated the danger on this side, as was wished and expected. Complaints are everywhere heard from our most considerate and virtuous citizens, equally the friends of public and private faith, and of public and personal liberty, that our governments are too unstable, that the public good is disregarded in the conflicts of rival parties, and that measures are too often decided, not according to the rules of justice and the rights of the minor party, but by the superior force of an interested and overbearing majority. However anxiously we may wish that these complaints had no foundation, the evidence, of known facts will not permit us to deny that they are in some degree true. It will be found, indeed, on a candid review of our situation, that some of the distresses under which we labor have been erroneously charged on the operation of our governments; but it will be found, at the same time, that other causes will not alone account for many of our heaviest misfortunes; and, particularly, for that prevailing and increasing distrust of public engagements, and alarm for private rights, which are echoed from one end of the continent to the other. These must be chiefly, if not wholly, effects of the unsteadiness and injustice with which a factious spirit has tainted our public administrations.", "role": "problem", "label": "파벌은 민중 정부의 병폐", "evidence": "The friend of popular governments never finds himself so much alarmed for their character and fate, as when he contemplates their propensity to this dangerous vice.", "lanes": {"majority": {"weight": "minor", "quote": "by the superior force of an interested and overbearing majority"}, "liberty": {"weight": "minor", "quote": "the adversaries to liberty derive their most specious declamations"}, "extent": {"weight": "minor", "quote": "advantages promised by a wellconstructed Union"}}}, {"id": "P2", "kind": "paragraph", "section": "S1", "text": "By a faction, I understand a number of citizens, whether amounting to a majority or a minority of the whole, who are united and actuated by some common impulse of passion, or of interest, adversed to the rights of other citizens, or to the permanent and aggregate interests of the community.", "role": "context", "label": "파벌의 정의", "evidence": "a number of citizens, whether amounting to a majority or a minority of the whole, who are united and actuated by some common impulse of passion, or of interest, adversed to the rights of other citizens", "lanes": {"majority": {"weight": "minor", "quote": "whether amounting to a majority or a minority of the whole"}}}, {"id": "P3", "kind": "paragraph", "section": "S2", "text": "There are two methods of curing the mischiefs of faction: the one, by removing its causes; the other, by controlling its effects.", "role": "framework", "label": "두 처방: 원인 제거, 결과 통제", "evidence": "There are two methods of curing the mischiefs of faction", "lanes": {"causes": {"weight": "major", "quote": "the one, by removing its causes"}, "majority": {"weight": "minor", "quote": "the other, by controlling its effects"}}}, {"id": "P4", "kind": "paragraph", "section": "S2", "text": "There are again two methods of removing the causes of faction: the one, by destroying the liberty which is essential to its existence; the other, by giving to every citizen the same opinions, the same passions, and the same interests.", "role": "framework", "label": "원인을 없애는 두 방법", "evidence": "the one, by destroying the liberty which is essential to its existence; the other, by giving to every citizen the same opinions, the same passions, and the same interests", "lanes": {"causes": {"weight": "major", "quote": "There are again two methods of removing the causes of faction"}, "liberty": {"weight": "minor", "quote": "by destroying the liberty which is essential to its existence"}}}, {"id": "P5", "kind": "paragraph", "section": "S2", "text": "It could never be more truly said than of the first remedy, that it was worse than the disease. Liberty is to faction what air is to fire, an aliment without which it instantly expires. But it could not be less folly to abolish liberty, which is essential to political life, because it nourishes faction, than it would be to wish the annihilation of air, which is essential to animal life, because it imparts to fire its destructive agency.", "role": "claim", "label": "자유를 없애는 건 어리석다", "evidence": "it could not be less folly to abolish liberty, which is essential to political life, because it nourishes faction", "lanes": {"causes": {"weight": "major", "quote": "It could never be more truly said than of the first remedy, that it was worse than the disease"}, "liberty": {"weight": "major", "quote": "Liberty is to faction what air is to fire, an aliment without which it instantly expires"}}}, {"id": "P6", "kind": "paragraph", "section": "S2", "text": "The second expedient is as impracticable as the first would be unwise. As long as the reason of man continues fallible, and he is at liberty to exercise it, different opinions will be formed. As long as the connection subsists between his reason and his self-love, his opinions and his passions will have a reciprocal influence on each other; and the former will be objects to which the latter will attach themselves. The diversity in the faculties of men, from which the rights of property originate, is not less an insuperable obstacle to a uniformity of interests. The protection of these faculties is the first object of government. From the protection of different and unequal faculties of acquiring property, the possession of different degrees and kinds of property immediately results; and from the influence of these on the sentiments and views of the respective proprietors, ensues a division of the society into different interests and parties.", "role": "claim", "label": "의견·열정·이익의 통일은 불가능", "evidence": "The second expedient is as impracticable as the first would be unwise.", "lanes": {"causes": {"weight": "major", "quote": "different opinions will be formed"}, "liberty": {"weight": "minor", "quote": "he is at liberty to exercise it"}, "property": {"weight": "major", "quote": "The diversity in the faculties of men, from which the rights of property originate, is not less an insuperable obstacle to a uniformity of interests"}}}, {"id": "P7", "kind": "paragraph", "section": "S2", "text": "The latent causes of faction are thus sown in the nature of man; and we see them everywhere brought into different degrees of activity, according to the different circumstances of civil society. A zeal for different opinions concerning religion, concerning government, and many other points, as well of speculation as of practice; an attachment to different leaders ambitiously contending for pre-eminence and power; or to persons of other descriptions whose fortunes have been interesting to the human passions, have, in turn, divided mankind into parties, inflamed them with mutual animosity, and rendered them much more disposed to vex and oppress each other than to co-operate for their common good. So strong is this propensity of mankind to fall into mutual animosities, that where no substantial occasion presents itself, the most frivolous and fanciful distinctions have been sufficient to kindle their unfriendly passions and excite their most violent conflicts. But the most common and durable source of factions has been the various and unequal distribution of property. Those who hold and those who are without property have ever formed distinct interests in society. Those who are creditors, and those who are debtors, fall under a like discrimination. A landed interest, a manufacturing interest, a mercantile interest, a moneyed interest, with many lesser interests, grow up of necessity in civilized nations, and divide them into different classes, actuated by different sentiments and views. The regulation of these various and interfering interests forms the principal task of modern legislation, and involves the spirit of party and faction in the necessary and ordinary operations of the government.", "role": "claim", "label": "원인은 인간 본성에 있다", "evidence": "The latent causes of faction are thus sown in the nature of man", "lanes": {"causes": {"weight": "major", "quote": "the most frivolous and fanciful distinctions have been sufficient to kindle their unfriendly passions"}, "property": {"weight": "major", "quote": "the most common and durable source of factions has been the various and unequal distribution of property"}}}, {"id": "P8", "kind": "paragraph", "section": "S2", "text": "No man is allowed to be a judge in his own cause, because his interest would certainly bias his judgment, and, not improbably, corrupt his integrity. With equal, nay with greater reason, a body of men are unfit to be both judges and parties at the same time; yet what are many of the most important acts of legislation, but so many judicial determinations, not indeed concerning the rights of single persons, but concerning the rights of large bodies of citizens? And what are the different classes of legislators but advocates and parties to the causes which they determine? Is a law proposed concerning private debts? It is a question to which the creditors are parties on one side and the debtors on the other. Justice ought to hold the balance between them. Yet the parties are, and must be, themselves the judges; and the most numerous party, or, in other words, the most powerful faction must be expected to prevail. Shall domestic manufactures be encouraged, and in what degree, by restrictions on foreign manufactures? are questions which would be differently decided by the landed and the manufacturing classes, and probably by neither with a sole regard to justice and the public good. The apportionment of taxes on the various descriptions of property is an act which seems to require the most exact impartiality; yet there is, perhaps, no legislative act in which greater opportunity and temptation are given to a predominant party to trample on the rules of justice. Every shilling with which they overburden the inferior number, is a shilling saved to their own pockets.", "role": "claim", "label": "입법자가 자기 사건의 재판관", "evidence": "And what are the different classes of legislators but advocates and parties to the causes which they determine?", "lanes": {"causes": {"weight": "major", "quote": "Yet the parties are, and must be, themselves the judges"}, "majority": {"weight": "minor", "quote": "the most numerous party, or, in other words, the most powerful faction must be expected to prevail"}, "property": {"weight": "minor", "quote": "The apportionment of taxes on the various descriptions of property"}}}, {"id": "P9", "kind": "paragraph", "section": "S2", "text": "It is in vain to say that enlightened statesmen will be able to adjust these clashing interests, and render them all subservient to the public good. Enlightened statesmen will not always be at the helm. Nor, in many cases, can such an adjustment be made at all without taking into view indirect and remote considerations, which will rarely prevail over the immediate interest which one party may find in disregarding the rights of another or the good of the whole.", "role": "counter", "label": "현명한 정치가로는 부족하다", "evidence": "Enlightened statesmen will not always be at the helm.", "lanes": {"causes": {"weight": "major", "quote": "It is in vain to say that enlightened statesmen will be able to adjust these clashing interests"}}}, {"id": "P10", "kind": "paragraph", "section": "S2", "text": "The inference to which we are brought is, that the CAUSES of faction cannot be removed, and that relief is only to be sought in the means of controlling its EFFECTS.", "role": "implication", "label": "원인은 남으니 결과를 통제", "evidence": "The inference to which we are brought is, that the CAUSES of faction cannot be removed", "lanes": {"causes": {"weight": "major", "quote": "the CAUSES of faction cannot be removed"}, "majority": {"weight": "minor", "quote": "relief is only to be sought in the means of controlling its EFFECTS"}}}, {"id": "P11", "kind": "paragraph", "section": "S3", "text": "If a faction consists of less than a majority, relief is supplied by the republican principle, which enables the majority to defeat its sinister views by regular vote. It may clog the administration, it may convulse the society; but it will be unable to execute and mask its violence under the forms of the Constitution. When a majority is included in a faction, the form of popular government, on the other hand, enables it to sacrifice to its ruling passion or interest both the public good and the rights of other citizens. To secure the public good and private rights against the danger of such a faction, and at the same time to preserve the spirit and the form of popular government, is then the great object to which our inquiries are directed. Let me add that it is the great desideratum by which this form of government can be rescued from the opprobrium under which it has so long labored, and be recommended to the esteem and adoption of mankind.", "role": "problem", "label": "위험은 다수 파벌이다", "evidence": "When a majority is included in a faction, the form of popular government, on the other hand, enables it to sacrifice to its ruling passion or interest both the public good and the rights of other citizens.", "lanes": {"majority": {"weight": "major", "quote": "To secure the public good and private rights against the danger of such a faction, and at the same time to preserve the spirit and the form of popular government"}}}, {"id": "P12", "kind": "paragraph", "section": "S3", "text": "By what means is this object attainable? Evidently by one of two only. Either the existence of the same passion or interest in a majority at the same time must be prevented, or the majority, having such coexistent passion or interest, must be rendered, by their number and local situation, unable to concert and carry into effect schemes of oppression. If the impulse and the opportunity be suffered to coincide, we well know that neither moral nor religious motives can be relied on as an adequate control. They are not found to be such on the injustice and violence of individuals, and lose their efficacy in proportion to the number combined together, that is, in proportion as their efficacy becomes needful.", "role": "framework", "label": "다수를 막는 두 가지 수단", "evidence": "Either the existence of the same passion or interest in a majority at the same time must be prevented, or the majority, having such coexistent passion or interest, must be rendered, by their number and local situation, unable to concert and carry into effect schemes of oppression.", "lanes": {"majority": {"weight": "major", "quote": "By what means is this object attainable? Evidently by one of two only."}, "extent": {"weight": "minor", "quote": "by their number and local situation"}}}, {"id": "P13", "kind": "paragraph", "section": "S3", "text": "From this view of the subject it may be concluded that a pure democracy, by which I mean a society consisting of a small number of citizens, who assemble and administer the government in person, can admit of no cure for the mischiefs of faction. A common passion or interest will, in almost every case, be felt by a majority of the whole; a communication and concert result from the form of government itself; and there is nothing to check the inducements to sacrifice the weaker party or an obnoxious individual. Hence it is that such democracies have ever been spectacles of turbulence and contention; have ever been found incompatible with personal security or the rights of property; and have in general been as short in their lives as they have been violent in their deaths. Theoretic politicians, who have patronized this species of government, have erroneously supposed that by reducing mankind to a perfect equality in their political rights, they would, at the same time, be perfectly equalized and assimilated in their possessions, their opinions, and their passions.", "role": "implication", "label": "순수 민주정엔 처방이 없다", "evidence": "a pure democracy, by which I mean a society consisting of a small number of citizens, who assemble and administer the government in person, can admit of no cure for the mischiefs of faction", "lanes": {"majority": {"weight": "major", "quote": "A common passion or interest will, in almost every case, be felt by a majority of the whole"}, "property": {"weight": "minor", "quote": "incompatible with personal security or the rights of property"}, "extent": {"weight": "minor", "quote": "a society consisting of a small number of citizens"}}}, {"id": "P14", "kind": "paragraph", "section": "S4", "text": "A republic, by which I mean a government in which the scheme of representation takes place, opens a different prospect, and promises the cure for which we are seeking. Let us examine the points in which it varies from pure democracy, and we shall comprehend both the nature of the cure and the efficacy which it must derive from the Union.", "role": "thesis", "label": "공화국이 처방을 약속한다", "evidence": "A republic, by which I mean a government in which the scheme of representation takes place, opens a different prospect, and promises the cure for which we are seeking.", "lanes": {"majority": {"weight": "major", "quote": "promises the cure for which we are seeking"}, "repr": {"weight": "minor", "quote": "a government in which the scheme of representation takes place"}, "extent": {"weight": "minor", "quote": "the efficacy which it must derive from the Union"}}}, {"id": "P15", "kind": "paragraph", "section": "S4", "text": "The two great points of difference between a democracy and a republic are: first, the delegation of the government, in the latter, to a small number of citizens elected by the rest; secondly, the greater number of citizens, and greater sphere of country, over which the latter may be extended.", "role": "framework", "label": "위임과 더 넓은 영역", "evidence": "first, the delegation of the government, in the latter, to a small number of citizens elected by the rest; secondly, the greater number of citizens, and greater sphere of country, over which the latter may be extended", "lanes": {"repr": {"weight": "major", "quote": "the delegation of the government, in the latter, to a small number of citizens elected by the rest"}, "extent": {"weight": "major", "quote": "the greater number of citizens, and greater sphere of country, over which the latter may be extended"}}}, {"id": "P16", "kind": "paragraph", "section": "S4", "text": "The effect of the first difference is, on the one hand, to refine and enlarge the public views, by passing them through the medium of a chosen body of citizens, whose wisdom may best discern the true interest of their country, and whose patriotism and love of justice will be least likely to sacrifice it to temporary or partial considerations. Under such a regulation, it may well happen that the public voice, pronounced by the representatives of the people, will be more consonant to the public good than if pronounced by the people themselves, convened for the purpose. On the other hand, the effect may be inverted. Men of factious tempers, of local prejudices, or of sinister designs, may, by intrigue, by corruption, or by other means, first obtain the suffrages, and then betray the interests, of the people. The question resulting is, whether small or extensive republics are more favorable to the election of proper guardians of the public weal; and it is clearly decided in favor of the latter by two obvious considerations:", "role": "claim", "label": "견해를 정제할 수도, 배신할 수도", "evidence": "it may well happen that the public voice, pronounced by the representatives of the people, will be more consonant to the public good than if pronounced by the people themselves", "lanes": {"repr": {"weight": "major", "quote": "to refine and enlarge the public views, by passing them through the medium of a chosen body of citizens"}, "extent": {"weight": "minor", "quote": "whether small or extensive republics are more favorable to the election of proper guardians of the public weal"}}}, {"id": "P17", "kind": "paragraph", "section": "S4", "text": "In the first place, it is to be remarked that, however small the republic may be, the representatives must be raised to a certain number, in order to guard against the cabals of a few; and that, however large it may be, they must be limited to a certain number, in order to guard against the confusion of a multitude. Hence, the number of representatives in the two cases not being in proportion to that of the two constituents, and being proportionally greater in the small republic, it follows that, if the proportion of fit characters be not less in the large than in the small republic, the former will present a greater option, and consequently a greater probability of a fit choice.", "role": "claim", "label": "적임자를 뽑을 확률이 더 크다", "evidence": "if the proportion of fit characters be not less in the large than in the small republic, the former will present a greater option, and consequently a greater probability of a fit choice", "lanes": {"repr": {"weight": "major", "quote": "the representatives must be raised to a certain number, in order to guard against the cabals of a few"}, "extent": {"weight": "minor", "quote": "however large it may be, they must be limited to a certain number"}}}, {"id": "P18", "kind": "paragraph", "section": "S4", "text": "In the next place, as each representative will be chosen by a greater number of citizens in the large than in the small republic, it will be more difficult for unworthy candidates to practice with success the vicious arts by which elections are too often carried; and the suffrages of the people being more free, will be more likely to centre in men who possess the most attractive merit and the most diffusive and established characters.", "role": "claim", "label": "부정한 술수가 덜 통한다", "evidence": "it will be more difficult for unworthy candidates to practice with success the vicious arts by which elections are too often carried", "lanes": {"repr": {"weight": "major", "quote": "will be more likely to centre in men who possess the most attractive merit and the most diffusive and established characters"}, "extent": {"weight": "minor", "quote": "chosen by a greater number of citizens in the large than in the small republic"}}}, {"id": "P19", "kind": "paragraph", "section": "S4", "text": "It must be confessed that in this, as in most other cases, there is a mean, on both sides of which inconveniences will be found to lie. By enlarging too much the number of electors, you render the representatives too little acquainted with all their local circumstances and lesser interests; as by reducing it too much, you render him unduly attached to these, and too little fit to comprehend and pursue great and national objects. The federal Constitution forms a happy combination in this respect; the great and aggregate interests being referred to the national, the local and particular to the State legislatures.", "role": "counter", "label": "규모의 한계와 연방의 조합", "evidence": "there is a mean, on both sides of which inconveniences will be found to lie", "lanes": {"repr": {"weight": "major", "quote": "By enlarging too much the number of electors, you render the representatives too little acquainted with all their local circumstances and lesser interests"}}}, {"id": "P20", "kind": "paragraph", "section": "S5", "text": "The other point of difference is, the greater number of citizens and extent of territory which may be brought within the compass of republican than of democratic government; and it is this circumstance principally which renders factious combinations less to be dreaded in the former than in the latter. The smaller the society, the fewer probably will be the distinct parties and interests composing it; the fewer the distinct parties and interests, the more frequently will a majority be found of the same party; and the smaller the number of individuals composing a majority, and the smaller the compass within which they are placed, the more easily will they concert and execute their plans of oppression. Extend the sphere, and you take in a greater variety of parties and interests; you make it less probable that a majority of the whole will have a common motive to invade the rights of other citizens; or if such a common motive exists, it will be more difficult for all who feel it to discover their own strength, and to act in unison with each other. Besides other impediments, it may be remarked that, where there is a consciousness of unjust or dishonorable purposes, communication is always checked by distrust in proportion to the number whose concurrence is necessary.", "role": "claim", "label": "파당이 많을수록 권리가 더 안전", "evidence": "you make it less probable that a majority of the whole will have a common motive to invade the rights of other citizens", "
